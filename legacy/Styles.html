<style>
:root {
  --bg:#11121b; --panel:#1b1d2a; --panel2:#242638;
  --border:#35374d; --text:#f1f0fa; --muted:#999db6;
  --accent:#b9a5ff; --cyan:#83e5ed; --green:#8fe0bd;
  --orange:#f4c58b; --red:#f49aaa;
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
body {
  margin:0; min-height:100vh; color:var(--text);
  background:radial-gradient(ellipse at 8% 0%,#30274e 0,transparent 42%),var(--bg);
  font:14px/1.45 Inter,system-ui,sans-serif;
}
button,input,select,textarea { font:inherit; }
button { cursor:pointer; }
.app { padding:24px 26px; }
.topbar,.brand,.header-actions { display:flex; align-items:center; gap:12px; }
.topbar { justify-content:space-between; margin-bottom:22px; }
.brand { min-width:0; }
.logo {
  display:grid; place-items:center; width:46px; height:46px;
  flex:0 0 46px; border-radius:15px; font-size:23px;
  color:#211b34; background:linear-gradient(135deg,#c9baff,#83e5ed);
}
h1 { margin:0; font-size:23px; letter-spacing:-.5px; }
.subtitle,.sync-label { color:var(--muted); font-size:12px; }
.subtitle { margin-top:3px; }
.sync-label { white-space:nowrap; }
.btn {
  padding:10px 13px; border:1px solid var(--border);
  border-radius:10px; color:var(--text); background:var(--panel2);
  transition:border-color .15s,transform .15s;
}
.btn:hover { border-color:var(--accent); }
.btn:disabled { opacity:.55; cursor:wait; }
.btn.primary {
  border:0; color:#211b34; font-weight:750;
  background:linear-gradient(120deg,#c9baff,#83e5ed);
}
.btn.small { padding:6px 11px; font-size:12px; }
.btn.icon { min-width:32px; padding:6px 0; text-align:center; }
.btn.icon:disabled { opacity:.4; cursor:default; }
.btn.danger { color:#ffb3bf; border-color:#6b3441; }
.btn.danger:hover { border-color:var(--red); }
.filters {
  display:grid; grid-template-columns:minmax(190px,2fr) repeat(5,minmax(120px,1fr));
  gap:9px; margin-bottom:14px; padding:12px;
  border:1px solid var(--border); border-radius:15px; background:#1b1d2ae8;
}
.field {
  width:100%; min-width:0; padding:10px 11px;
  border:1px solid var(--border); border-radius:9px;
  outline:none; color:var(--text); background:#12141e;
}
.field:focus,.property-input:focus { border-color:var(--accent); }
.field.small { padding:6px 9px; font-size:12px; }
select.field { height:38px; padding:7px 10px; font-size:12px; cursor:pointer; }
select.field.small { height:32px; padding:4px 9px; }
.field option { color:var(--text); background:#202234; }
.stats { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
.stat {
  padding:7px 11px; border:1px solid var(--border);
  border-radius:10px; color:var(--muted); background:#1b1d2ab8; font-size:12px;
}
.stat strong { margin-left:4px; color:var(--text); }
.board {
  display:flex; align-items:stretch; gap:12px; min-height:60vh;
  overflow-x:auto; padding:2px 2px 18px;
  scrollbar-color:#48445f transparent; scrollbar-width:thin;
}
.lane {
  flex:0 0 265px; width:265px; min-width:265px; min-height:330px;
  padding:11px; border:1px solid var(--border); border-radius:16px;
  background:#1a1c29e8; transition:background .15s,border-color .15s;
}
.lane.drag-over { border-color:var(--accent); background:#29243e; }
.lane-head { display:flex; align-items:center; gap:7px; margin:2px 1px 12px; }
.lane-title {
  display:flex; align-items:center; gap:8px; flex:1; min-width:0;
  font-size:11px; font-weight:750; text-transform:uppercase; letter-spacing:.35px;
  overflow-wrap:anywhere;
}
.dot {
  width:8px; height:8px; flex:0 0 8px; border-radius:50%;
  background:var(--lane-color); box-shadow:0 0 10px color-mix(in srgb,var(--lane-color),transparent 30%);
}
.count {
  display:grid; place-items:center; min-width:24px; height:23px; padding:0 5px;
  border-radius:8px; color:var(--muted); background:#2a2c40; font-size:11px;
}
.add-lane {
  flex:0 0 27px; width:27px; height:27px; padding:0;
  border:1px solid var(--border); border-radius:9px;
  color:var(--accent); background:#282a3d; font-size:19px;
}
.add-lane:hover { border-color:var(--accent); }
.lane-cards { min-height:275px; }
.empty {
  padding:22px 8px; border:1px dashed #3a3c52; border-radius:11px;
  color:#8589a2; text-align:center; font-size:12px;
}
.task {
  margin-bottom:9px; padding:12px; border:1px solid #33354a;
  border-radius:13px; background:linear-gradient(145deg,#27293b,#202231);
  cursor:grab; transition:transform .15s,border-color .15s;
}
.task:hover { border-color:#8176b5; transform:translateY(-1px); box-shadow:0 8px 24px #0004; }
.task.dragging { opacity:.35; }
.task-top { display:flex; justify-content:space-between; gap:8px; margin-bottom:8px; }
.task-id { color:var(--cyan); font-size:11px; font-weight:750; }
.task-title { font-size:13px; font-weight:650; overflow-wrap:anywhere; white-space:pre-wrap; }
.task-meta { display:flex; flex-wrap:wrap; gap:6px; margin-top:11px; }
.tag,.value-pill {
  display:inline-flex; align-items:center; max-width:100%;
  padding:4px 9px; border:1px solid transparent; border-radius:999px;
  font-size:10px; line-height:1.4; overflow-wrap:anywhere;
}
.tag.flow,.pill-flow { color:#a3edf3; background:#193b43; border-color:#28535d; }
.tag.version,.pill-version { color:#d5c5ff; background:#392f54; border-color:#51416e; }
.tag.date,.pill-date { color:#f6d2a0; background:#443522; border-color:#624c30; }
.tag.category,.pill-category { color:#aee7c8; background:#203f35; border-color:#315e4c; }
.tag.assignee,.pill-assignee { color:#b8d5ff; background:#26384e; border-color:#3a5272; }
.tag.developer,.pill-developer { color:#f2b9d7; background:#462b42; border-color:#65405e; }
.tag.status,.pill-status { color:#d3c7ff; background:#332b50; border-color:#514272; }
/* Нейтральная метка для пользовательских свойств */
.tag.generic,.pill-generic { color:#d4d6e6; background:#2c2f45; border-color:#43465f; }

/* Назначенные цвета значений (этап 2). Идут после стилей по умолчанию и перекрывают их. */
.tag.c-gray,.value-pill.c-gray { color:#cfd1de; background:#2f3243; border-color:#464a60; }
.tag.c-red,.value-pill.c-red { color:#ffb3bf; background:#4a2630; border-color:#6b3441; }
.tag.c-orange,.value-pill.c-orange { color:#f6cd96; background:#4a3523; border-color:#6a4c30; }
.tag.c-yellow,.value-pill.c-yellow { color:#f3e08f; background:#463f1f; border-color:#655c2d; }
.tag.c-green,.value-pill.c-green { color:#aee7c8; background:#203f35; border-color:#315e4c; }
.tag.c-blue,.value-pill.c-blue { color:#b8d5ff; background:#26384e; border-color:#3a5272; }
.tag.c-purple,.value-pill.c-purple { color:#d5c5ff; background:#392f54; border-color:#51416e; }
.tag.c-pink,.value-pill.c-pink { color:#f2b9d7; background:#462b42; border-color:#65405e; }

/* Описание на карточке доски: отформатированный текст, ограниченный по высоте */
.task-comment {
  margin-top:9px; max-height:68px; overflow:hidden;
  color:var(--muted); font-size:11px; line-height:1.45;
  white-space:pre-wrap; overflow-wrap:anywhere;
}
.task-comment ul,.task-comment ol { margin:2px 0; padding-left:18px; }
.task-comment b { color:#c9cce0; }
.task-bottom {
  display:flex; justify-content:space-between; gap:8px;
  margin-top:10px; color:var(--muted); font-size:11px;
}
.task-bottom span { overflow-wrap:anywhere; }

/* ---------- Окно карточки ---------- */
.overlay {
  display:none; position:fixed; inset:0; z-index:10;
  align-items:center; justify-content:center; padding:20px;
  background:#080910d9; backdrop-filter:blur(8px);
}
.overlay.open { display:flex; }
.overlay.fs { padding:0; }
.overlay.open { animation:overlay-in .15s ease-out; }
.overlay.open .task-editor { animation:editor-in .2s cubic-bezier(.2,.8,.2,1); }
@keyframes overlay-in { from { opacity:0; } to { opacity:1; } }
@keyframes editor-in { from { opacity:0; transform:translateY(10px) scale(.985); } to { opacity:1; transform:none; } }
@media (prefers-reduced-motion:reduce) {
  .overlay.open,.overlay.open .task-editor,.overlay.open .modal { animation:none; }
  .props-body,.props-chevron { transition:none; }
}
.task-editor {
  display:flex; flex-direction:column; width:min(980px,100%);
  height:min(860px,calc(100dvh - 40px)); min-height:0; overflow:hidden;
  border:1px solid #41435b; border-radius:16px;
  background:radial-gradient(ellipse at 0 0,#33294b55,transparent 45%),#1b1d2a;
  box-shadow:0 25px 100px #0008;
}
.overlay.fs .task-editor {
  width:100%; height:100%; max-height:100%; border:0; border-radius:0;
}

/* 1. Компактная шапка */
.editor-header {
  display:flex; flex:0 0 auto; align-items:center; gap:10px;
  padding:10px 14px; border-bottom:1px solid var(--border);
}
.editor-id {
  flex:0 0 auto; max-width:34%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  padding:4px 9px; border:1px solid #28535d; border-radius:999px;
  color:var(--cyan); background:#193b4366; font-size:11px; font-weight:700;
}
.title-field {
  flex:1; min-width:0; padding:6px 8px;
  border:1px solid transparent; border-radius:8px; outline:none;
  color:#fff; background:transparent; font-size:14px; font-weight:650;
  transition:background .15s,border-color .15s;
}
.title-field:hover { border-color:var(--border); }
.title-field:focus { border-color:var(--accent); background:#12141e; }
.title-field::placeholder { color:#666a83; font-weight:400; }
.header-tools { display:flex; flex:0 0 auto; gap:6px; }
.icon-btn {
  width:30px; height:30px; padding:0; border:1px solid var(--border);
  border-radius:9px; color:var(--text); background:var(--panel2); font-size:13px;
}
.icon-btn:hover { border-color:var(--accent); }

.editor-form { display:flex; flex:1; flex-direction:column; min-height:0; }

/* 2. Панель свойств: ограниченная высота и собственная прокрутка */
.props-section {
  display:flex; flex:0 1 auto; flex-direction:column; min-height:0;
  border-bottom:1px solid var(--border);
}
.props-toggle {
  display:flex; align-items:center; gap:8px; width:100%; min-width:0;
  padding:7px 14px; border:0; color:var(--muted); background:transparent;
  text-align:left; font-size:10px; font-weight:700;
  letter-spacing:.6px; text-transform:uppercase;
  transition:color .15s,background .15s;
}
.props-toggle:hover { color:var(--text); background:#ffffff08; }
.props-toggle:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
.props-chevron { display:inline-block; flex:0 0 auto; font-size:11px; transition:transform .2s; }
.props-section.collapsed .props-chevron { transform:rotate(-90deg); }
.props-title { flex:0 0 auto; }
.props-summary {
  display:none; flex:1; min-width:0; gap:5px; overflow:hidden;
  letter-spacing:0; text-transform:none; font-weight:400;
  -webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);
  mask-image:linear-gradient(90deg,#000 88%,transparent);
}
.props-summary .value-pill { flex:0 0 auto; white-space:nowrap; }
.props-section.collapsed .props-summary { display:flex; }
/* Плавное сворачивание: строка сетки 1fr → 0fr */
.props-body {
  display:grid; grid-template-rows:1fr; min-height:0;
  transition:grid-template-rows .22s ease;
}
.props-section.collapsed .props-body { grid-template-rows:0fr; }
.properties-panel {
  min-height:0; max-height:min(280px,34dvh); overflow-y:auto;
  padding:0 14px 8px;
  scrollbar-color:#48445f transparent; scrollbar-width:thin;
}
.props-section.collapsed .properties-panel { overflow:hidden; padding-bottom:0; }
.property-grid { display:flex; flex-direction:column; gap:1px; }
.property {
  display:grid; grid-template-columns:150px minmax(0,1fr);
  align-items:center; gap:10px; min-width:0; min-height:32px;
  padding:1px 6px; border:1px solid transparent; border-radius:8px;
  transition:background .15s,border-color .15s;
}
.property:hover { background:#222435; border-color:#303247; }
.property:focus-within { background:#222435; border-color:#3b3d57; }
.properties-panel::-webkit-scrollbar,.comment-field::-webkit-scrollbar,.pill-menu::-webkit-scrollbar { width:8px; }
.properties-panel::-webkit-scrollbar-thumb,.comment-field::-webkit-scrollbar-thumb,.pill-menu::-webkit-scrollbar-thumb { border-radius:8px; background:#48445f; }
.property label {
  display:flex; align-items:center; min-width:0;
  color:#a4a7bf; font-size:11px; overflow-wrap:anywhere;
}
.property-input {
  width:100%; min-width:0; height:28px; padding:4px 8px;
  border:1px solid transparent; border-radius:7px; outline:none;
  color:var(--text); background:transparent; font-size:11px;
  transition:background .15s,border-color .15s;
}
.property-input:hover,.property-input:focus { border-color:var(--border); background:#12141e; }
.prop-control { min-width:0; }
.pill-select { position:relative; min-width:0; }
.pill-trigger {
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  width:100%; min-width:0; min-height:28px; padding:2px 6px;
  border:1px solid transparent; border-radius:8px;
  background:transparent; text-align:left; color:var(--text);
}
.pill-trigger:hover,.pill-trigger:focus-visible { border-color:var(--border); background:#12141e; outline:none; }
.pill-trigger .value-pill { min-width:0; }
.pill-placeholder { padding-left:3px; color:#8589a2; font-size:11px; }
.pill-chevron { flex:0 0 auto; color:#898da8; font-size:10px; }
.date-trigger .date-value { padding-left:3px; font-size:11px; }
.date-value.legacy { color:var(--orange); }

/* 3. Основная область текста */
.comment-section {
  display:flex; flex:1 1 0; flex-direction:column; min-height:150px;
  padding:8px 14px 10px;
}
.comment-section[hidden] { display:none; }
.comment-head {
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  margin-bottom:6px; color:var(--muted); font-size:11px; font-weight:600;
}
.comment-hint { color:#777c96; font-size:10px; font-weight:400; }
.rich-toolbar {
  display:flex; flex:0 0 auto; flex-wrap:wrap; align-items:center; gap:3px;
  padding:4px; border:1px solid var(--border); border-bottom:0;
  border-radius:10px 10px 0 0; background:#171925;
}
.rich-toolbar button {
  min-width:28px; height:26px; padding:0 7px; border:1px solid transparent;
  border-radius:7px; color:var(--text); background:transparent; font-size:12px;
}
.rich-toolbar button { display:inline-grid; place-items:center; transition:background .12s,border-color .12s; }
.rich-toolbar button:hover { background:#2b2e45; }
.rich-toolbar button:active { transform:translateY(1px); }
.rich-toolbar button.active { border-color:var(--accent); background:#332b50; color:#fff; box-shadow:0 0 0 2px #b9a5ff1f; }
.tb-sep { width:1px; height:16px; margin:0 4px; background:var(--border); }
.comment-field {
  flex:1; min-height:100px; overflow-y:auto; padding:12px 14px;
  border:1px solid var(--border); border-radius:0 0 10px 10px; outline:none;
  color:var(--text); background:#12141e; font-size:12px; line-height:1.6;
  white-space:pre-wrap; overflow-wrap:anywhere;
  scrollbar-color:#48445f transparent; scrollbar-width:thin;
}
.comment-field { box-shadow:inset 0 2px 8px #0003; transition:border-color .15s,box-shadow .15s; }
.comment-field:focus { border-color:var(--accent); box-shadow:inset 0 2px 8px #0003,0 0 0 3px #b9a5ff1f; }
.comment-field ::selection,.comment-field::selection { background:#b9a5ff55; }
.comment-field li::marker { color:var(--accent); }
.comment-field.is-empty::before {
  content:attr(data-placeholder); float:left; height:0;
  color:#686c85; pointer-events:none;
}
.comment-field ul,.comment-field ol { margin:4px 0; padding-left:22px; }

.editor-footer {
  display:flex; flex:0 0 auto; align-items:center; justify-content:space-between;
  gap:12px; padding:8px 14px; border-top:1px solid var(--border);
  color:var(--muted); background:#1b1d2af5; font-size:11px;
}
.save-status { display:flex; align-items:center; gap:7px; }
.save-status::before { content:""; width:7px; height:7px; flex:0 0 7px; border-radius:50%; background:var(--green); }
.save-status.saving::before { background:var(--orange); animation:pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity:.35; } }
@media (prefers-reduced-motion:reduce) { .save-status.saving::before { animation:none; } }
.save-status.error::before { background:var(--red); }
.editor-footer .save-status { width:100%; }
.notice {
  display:none; position:fixed; z-index:80; bottom:20px; left:50%;
  max-width:calc(100% - 30px); padding:12px 16px; transform:translateX(-50%);
  border:1px solid var(--border); border-radius:12px; background:#292c40;
  box-shadow:0 10px 40px #0005;
}
.notice.show { display:block; }
.notice.error { border-color:#a34459; }
.loading { padding:35px; color:var(--muted); text-align:center; }

/* Индикатор синхронизации в шапке */
.sync-label::before { content:""; display:inline-block; width:7px; height:7px; margin-right:6px; border-radius:50%; background:var(--muted); }
.sync-label.ok::before { background:var(--green); }
.sync-label.saving::before { background:var(--orange); }
.sync-label.error { color:var(--red); }
.sync-label.error::before { background:var(--red); }

/* Выпадающий список значений */
.pill-menu {
  position:fixed; z-index:60; min-width:220px; max-width:320px; max-height:300px;
  overflow-y:auto; padding:5px; border:1px solid var(--border); border-radius:11px;
  background:#202234; box-shadow:0 14px 50px #0009;
  scrollbar-color:#48445f transparent; scrollbar-width:thin;
}
.pill-row { display:flex; align-items:center; gap:2px; }
.pill-option {
  display:flex; flex:1; min-width:0; width:100%; padding:6px 8px; border:0; border-radius:8px;
  background:transparent; color:var(--text); text-align:left;
}
.pill-option:hover,.pill-option[aria-selected="true"] { background:#2b2e45; }
.none-pill { color:#8589a2; font-size:12px; }
.color-dot {
  flex:0 0 24px; width:24px; height:24px; padding:0; border:0; border-radius:7px;
  color:#898da8; background:transparent; font-size:12px;
}
.color-dot:hover,.color-dot.open { color:var(--text); background:#2b2e45; }
.swatch-row { display:flex; flex-wrap:wrap; gap:6px; padding:3px 8px 9px; }
.swatch-row[hidden] { display:none; }
.swatch {
  width:18px; height:18px; padding:0; border:2px solid transparent; border-radius:50%;
}
.swatch:hover { transform:scale(1.12); }
.swatch.on { border-color:#fff; }
.swatch.none { border:1px dashed #6b6f8a; background:transparent; color:#8589a2; font-size:10px; line-height:1; }
.swatch.none.on { border-style:solid; border-color:#fff; }

/* Календарь */
.cal-pop {
  position:fixed; z-index:60; width:248px; padding:10px;
  border:1px solid var(--border); border-radius:13px;
  background:#202234; box-shadow:0 14px 50px #0009;
}
.cal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.cal-title { font-size:12px; font-weight:700; }
.cal-nav {
  width:26px; height:26px; padding:0; border:1px solid var(--border);
  border-radius:8px; color:var(--text); background:var(--panel2);
}
.cal-nav:hover { border-color:var(--accent); }
.cal-week,.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; text-align:center; }
.cal-week span { padding:3px 0; color:var(--muted); font-size:10px; }
.cal-day {
  height:29px; padding:0; border:1px solid transparent; border-radius:8px;
  color:var(--text); background:transparent; font-size:12px;
}
.cal-day:hover { background:#2b2e45; }
.cal-day.today { border-color:var(--accent); }
.cal-day.selected { color:#211b34; font-weight:700; background:linear-gradient(120deg,#c9baff,#83e5ed); }
.cal-foot { display:flex; justify-content:space-between; margin-top:8px; }
.cal-link { padding:4px 6px; border:0; color:var(--accent); background:transparent; font-size:12px; }
.cal-link:hover { text-decoration:underline; }

/* ---------- Представления (этап 3) ---------- */
.viewbar {
  display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
  gap:10px 14px; margin-bottom:12px;
}
.view-tabs {
  display:flex; flex:1 1 280px; align-items:center; gap:6px; min-width:0; overflow-x:auto; padding:2px;
  scrollbar-width:none;
}
.view-tabs::-webkit-scrollbar { display:none; }
.view-chip {
  display:inline-flex; flex:0 0 auto; align-items:center;
  border:1px solid var(--border); border-radius:999px;
  color:var(--muted); background:#1b1d2ab8; font-size:12px;
  transition:color .15s,border-color .15s,background .15s;
}
.view-chip:hover { color:var(--text); border-color:#4a4c66; }
.view-chip.active {
  color:#211b34; border-color:transparent;
  background:linear-gradient(120deg,#c9baff,#83e5ed);
}
.view-chip .view-tab {
  max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  padding:7px 13px; border:0; color:inherit; background:transparent; font-size:12px;
}
.view-chip.active .view-tab { padding-right:6px; font-weight:700; }
.view-more {
  padding:0 10px 0 2px; border:0; color:inherit; background:transparent;
  font-size:15px; line-height:1;
}
.view-chip.add { padding:7px 12px; border-style:dashed; color:var(--accent); background:transparent; }
.view-chip.add:hover { border-color:var(--accent); }
.dirty-dot {
  display:inline-block; width:6px; height:6px; margin-left:6px; border-radius:50%;
  background:#c2571a; vertical-align:2px;
}
.view-tools { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
.sort-box { display:flex; align-items:center; gap:4px; }
.sort-box select.field { width:auto; min-width:170px; }
.badge {
  display:inline-block; margin-left:4px; padding:1px 6px; border-radius:8px;
  color:var(--text); background:#3a3d57; font-size:10px; vertical-align:1px;
}
.menu-item {
  display:block; width:100%; padding:8px 10px; border:0; border-radius:8px;
  color:var(--text); background:transparent; text-align:left; font-size:12px;
}
.menu-item:hover { background:#2b2e45; }
.menu-item.danger { color:#ffb3bf; }
.view-menu { min-width:210px; }

/* Панель «фильтры изменены» */
.draft-bar {
  display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
  gap:8px 14px; margin-bottom:12px; padding:9px 12px;
  border:1px solid #6a5a2e; border-radius:12px; background:#2c2615cc;
}
.draft-text { color:#f3e0a8; font-size:12px; }
.draft-actions { display:flex; flex-wrap:wrap; gap:6px; }

/* Панель фильтров */
.filter-pop {
  position:fixed; z-index:60; display:flex; flex-direction:column;
  width:340px; max-width:calc(100vw - 16px); max-height:min(70dvh,520px); overflow:hidden;
  border:1px solid var(--border); border-radius:13px;
  background:#202234; box-shadow:0 14px 50px #0009;
}
.fp-head {
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:10px 12px; border-bottom:1px solid var(--border);
  font-size:12px; font-weight:700;
}
.fp-reset { padding:2px 4px; border:0; color:var(--accent); background:transparent; font-size:11px; font-weight:400; }
.fp-reset:hover { text-decoration:underline; }
.fp-body {
  flex:1; min-height:0; overflow-y:auto; padding:6px;
  scrollbar-color:#48445f transparent; scrollbar-width:thin;
}
.fp-group > summary {
  display:flex; align-items:center; gap:8px; padding:8px; border-radius:8px;
  list-style:none; cursor:pointer; font-size:12px;
}
.fp-group > summary::-webkit-details-marker { display:none; }
.fp-group > summary::before { content:"▸"; color:#898da8; font-size:10px; transition:transform .15s; }
.fp-group[open] > summary::before { transform:rotate(90deg); }
.fp-group > summary:hover { background:#2b2e45; }
.fp-name { flex:1; min-width:0; overflow-wrap:anywhere; }
.fp-count {
  min-width:18px; padding:1px 6px; border-radius:8px; text-align:center;
  color:#211b34; background:linear-gradient(120deg,#c9baff,#83e5ed); font-size:10px; font-weight:700;
}
.fp-options {
  display:flex; flex-direction:column; gap:1px; max-height:190px; overflow-y:auto;
  padding:2px 6px 8px 24px;
}
.fp-option { display:flex; align-items:center; gap:8px; padding:4px 6px; border-radius:7px; cursor:pointer; font-size:12px; }
.fp-option:hover { background:#2b2e45; }
.fp-option input { accent-color:#b9a5ff; }
.fp-empty { color:#8589a2; font-style:italic; }
.fp-dates { display:flex; flex-wrap:wrap; gap:10px; padding:2px 8px 10px 24px; color:var(--muted); font-size:12px; }
.fp-dates label { display:flex; align-items:center; gap:6px; }
.fp-dates input { width:auto; color-scheme:dark; }
.fp-text { padding:2px 8px 10px 24px; }

/* Диалоги */
.modal {
  display:flex; flex-direction:column; width:min(560px,100%);
  max-height:min(720px,calc(100dvh - 40px)); min-height:0; overflow:hidden;
  border:1px solid #41435b; border-radius:16px;
  background:radial-gradient(ellipse at 0 0,#33294b55,transparent 45%),#1b1d2a;
  box-shadow:0 25px 100px #0008;
}
.modal-overlay { z-index:40; }
.overlay.open .modal { animation:editor-in .2s cubic-bezier(.2,.8,.2,1); }
.modal-head {
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:14px 18px 12px; border-bottom:1px solid var(--border);
}
.modal-title { font-size:14px; font-weight:700; }
.modal-body {
  flex:1; min-height:0; overflow-y:auto; padding:14px 18px;
  scrollbar-color:#48445f transparent; scrollbar-width:thin;
}
.modal-foot {
  display:flex; align-items:center; justify-content:flex-end; gap:8px; flex-wrap:wrap;
  padding:10px 18px; border-top:1px solid var(--border);
  color:var(--muted); background:#1b1d2af5; font-size:11px;
}
.modal-label { display:block; margin-bottom:6px; color:var(--muted); font-size:11px; }
.modal-text { margin:0; font-size:13px; line-height:1.5; }
.m-tabs { display:flex; gap:4px; margin-bottom:10px; border-bottom:1px solid var(--border); }
.m-tab {
  padding:8px 12px; border:0; border-bottom:2px solid transparent;
  color:var(--muted); background:transparent; font-size:12px; font-weight:600;
}
.m-tab:hover { color:var(--text); }
.m-tab.active { color:var(--text); border-bottom-color:var(--accent); }
.m-count { margin-left:4px; padding:1px 6px; border-radius:8px; background:#2a2c40; font-size:10px; }
.m-hint { margin:10px 2px 0; color:#8589a2; font-size:11px; line-height:1.5; }
.m-actions { margin-top:10px; }
.col-row {
  display:flex; align-items:center; gap:10px; padding:7px 8px;
  border:1px solid transparent; border-radius:10px;
}
.col-row:hover { background:#222435; border-color:#303247; }
.col-row.dragging { opacity:.4; }
.col-row.drop-target { border-color:var(--accent); background:#29243e; }
.grip { color:#6b6f8a; cursor:grab; user-select:none; }
.col-dot { width:8px; height:8px; flex:0 0 8px; border-radius:50%; }
.col-name { flex:1; min-width:0; overflow-wrap:anywhere; font-size:12px; }
.col-count { padding:1px 7px; border-radius:8px; color:var(--muted); background:#2a2c40; font-size:11px; }
.mini {
  min-width:26px; height:26px; padding:0 7px; border:1px solid var(--border);
  border-radius:8px; color:var(--text); background:var(--panel2); font-size:12px;
}
.mini.text { font-size:11px; }
.mini:hover { border-color:var(--accent); }
.mini:disabled { opacity:.35; cursor:default; }
.mini:disabled:hover { border-color:var(--border); }
.field-row {
  display:flex; align-items:center; gap:10px; padding:7px 8px;
  border:1px solid transparent; border-radius:9px; cursor:pointer; font-size:12px;
}
.field-row:hover { background:#222435; border-color:#303247; }
.field-row input { accent-color:#b9a5ff; }
.field-name { flex:1; min-width:0; overflow-wrap:anywhere; }
.field-type { color:#8589a2; font-size:11px; }
.section-title {
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  margin-bottom:8px; color:var(--muted); font-size:11px; font-weight:700;
}
.link-btn {
  padding:2px 4px; border:0; color:var(--accent); background:transparent;
  font-size:11px; font-weight:400;
}
.link-btn:hover { text-decoration:underline; }
.check-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:6px; }
.check {
  display:flex; align-items:center; gap:8px; padding:6px 9px;
  border:1px solid var(--border); border-radius:9px; background:#171925;
  font-size:12px; cursor:pointer;
}
.check:hover { border-color:#4a4c66; }
.check input { accent-color:#b9a5ff; }
.board-note { padding:35px; color:var(--muted); text-align:center; }

/* ---------- Экспорт (этап 4) ---------- */
.ex-section { margin-bottom:20px; }
.ex-section:last-child { margin-bottom:0; }
.ex-links { display:flex; gap:6px; }
.ex-filters {
  margin-top:8px; max-height:260px; overflow-y:auto;
  border:1px solid var(--border); border-radius:12px; background:#171925;
  scrollbar-color:#48445f transparent; scrollbar-width:thin;
}
.ex-filters .fp-head { position:sticky; top:0; z-index:1; background:#171925; }
.ex-filters .fp-body { overflow:visible; }
.ex-count { margin-top:8px; color:var(--muted); font-size:12px; }
.ex-count strong { color:var(--text); }
.ex-count.zero strong { color:var(--red); }
.ex-format { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:8px; }
.ex-format select.field { width:auto; min-width:230px; }
.ex-format select.field:disabled { opacity:.45; cursor:default; }

@media(max-width:760px) {
  .view-tools { width:100%; }
  .sort-box { flex:1 1 100%; }
  .sort-box select.field { flex:1; }
  .view-tools .btn.small:not(.icon) { flex:1; }
  .modal { width:100% !important; height:100%; max-height:100%; border:0; border-radius:0; }
  .modal-head { padding:12px 14px 10px; }
  .modal-body { padding:12px 14px; }
  .modal-foot { padding:10px 14px max(10px,env(safe-area-inset-bottom)); }
  .filter-pop { width:calc(100vw - 16px); }
}

@media(max-width:1100px) {
  .filters { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .filters .search { grid-column:span 3; }
}
@media(max-width:760px) {
  .app { padding:15px 12px; }
  .topbar { align-items:flex-start; flex-wrap:wrap; }
  .header-actions { flex-wrap:wrap; }
  .sync-label { display:inline; font-size:11px; }
  .filters { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .filters .search { grid-column:span 2; }
  .overlay { padding:0; }
  .task-editor { width:100%; height:100%; max-height:100%; border:0; border-radius:0; }
  .editor-header { padding:8px 10px; }
  .editor-id { max-width:90px; }
  .props-toggle { padding:7px 10px; }
  .properties-panel { max-height:min(250px,34dvh); padding:0 10px 6px; }
  .property { grid-template-columns:110px minmax(0,1fr); gap:6px; }
  .comment-section { padding:8px 10px 8px; }
  .comment-hint { display:none; }
  .editor-footer { padding:8px 10px max(8px,env(safe-area-inset-bottom)); }
}
@media(max-width:430px) {
  .header-actions { width:100%; }
  .header-actions .btn { flex:1; }
  .property { grid-template-columns:96px minmax(0,1fr); }
}

/* ---------- Этап 5: layout, sidebar, базы знаний ---------- */
.layout {
  display:flex;
  min-height:100vh;
}

.sidebar {
  flex:0 0 270px;
  width:270px;
  min-height:100vh;
  padding:14px 12px;
  border-right:1px solid var(--border);
  background:#151723f2;
  display:flex;
  flex-direction:column;
  gap:14px;
  overflow-y:auto;
}

.main {
  flex:1;
  min-width:0;
}

.sidebar-head {
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}

.sidebar-brand {
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.logo.small {
  width:34px;
  height:34px;
  flex:0 0 34px;
  border-radius:12px;
  font-size:18px;
}

.sidebar-title-main {
  font-size:14px;
  font-weight:750;
}

.sidebar-subtitle {
  color:var(--muted);
  font-size:11px;
  margin-top:2px;
}

.sidebar-close {
  display:none;
}

.sidebar-section {
  display:flex;
  flex-direction:column;
  gap:6px;
}

.sidebar-section-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  color:var(--muted);
  font-size:10px;
  font-weight:750;
  letter-spacing:.55px;
  text-transform:uppercase;
  padding:0 4px;
}

.icon-btn.small {
  width:24px;
  height:24px;
  font-size:15px;
  border-radius:8px;
}

.sidebar-list {
  display:flex;
  flex-direction:column;
  gap:3px;
}

.side-item {
  display:flex;
  align-items:center;
  gap:4px;
  padding:2px;
  border:1px solid transparent;
  border-radius:10px;
  transition:background .15s,border-color .15s;
}

.side-item:hover {
  background:#222435;
  border-color:#303247;
}

.side-item.active {
  background:linear-gradient(120deg,#c9baff22,#83e5ed22);
  border-color:#5b527f;
}

.side-item.archived {
  opacity:.62;
}

.side-main {
  flex:1;
  min-width:0;
  padding:7px 8px;
  border:0;
  border-radius:8px;
  color:var(--text);
  background:transparent;
  text-align:left;
  font-size:12px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.side-menu {
  flex:0 0 26px;
  width:26px;
  height:26px;
  padding:0;
  border:0;
  border-radius:8px;
  color:var(--muted);
  background:transparent;
  font-size:15px;
  line-height:1;
}

.side-menu:hover {
  color:var(--text);
  background:#2b2e45;
}

.side-ext {
  color:#898da7;
  font-size:10px;
}

.sidebar-empty {
  padding:10px 8px;
  color:#8589a2;
  font-size:11px;
}

.sidebar-error {
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:8px;
  line-height:1.4;
  word-break:break-word;
}

/* Нижняя часть панели: архив и настройки прижаты к низу. */
.sidebar-footer {
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:auto;
}

.sidebar-archive-toggle {
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:auto;
  padding:8px;
  border-top:1px solid var(--border);
  color:var(--muted);
  font-size:12px;
  cursor:pointer;
}

.sidebar-archive-toggle input {
  accent-color:#b9a5ff;
}

.sidebar-toggle {
  display:none;
  flex:0 0 auto;
}

/* Скрытие панели на широком экране: плавное сворачивание, рабочая область занимает освободившееся место. */
.sidebar-collapse {
  display:inline-grid;
  place-items:center;
  flex:0 0 auto;
}

@media(min-width:981px) {
  /* Шапка панели и верхняя строка рабочей области стоят на одной линии (центр ≈ 47px от верха),
     поэтому кнопка скрытия и кнопка раскрытия не смещаются по вертикали. */
  .sidebar {
    padding-top:30px;
    overflow-x:hidden;
    transition:flex-basis .24s ease, width .24s ease, padding .24s ease, border-width .24s ease, opacity .2s ease;
  }

  /* Содержимое сохраняет ширину, пока панель сжимается, и не перестраивается по ходу анимации. */
  .sidebar > * {
    min-width:246px;
  }

  .sidebar-head {
    align-items:center;
  }

  /* Кнопка раскрытия «вырастает» из нулевой ширины, а логотип плавно съезжает вправо. */
  .sidebar-toggle {
    display:inline-grid;
    place-items:center;
    width:0;
    margin-right:-12px;
    border-width:0;
    opacity:0;
    overflow:hidden;
    visibility:hidden;
    pointer-events:none;
    transition:width .24s ease, margin .24s ease, border-width .24s ease, opacity .2s ease, visibility 0s linear .24s;
  }

  html.sidebar-collapsed .sidebar-toggle {
    width:30px;
    margin-right:0;
    border-width:1px;
    opacity:1;
    visibility:visible;
    pointer-events:auto;
    transition:width .24s ease, margin .24s ease, border-width .24s ease, opacity .2s ease .06s, visibility 0s;
  }

  html.sidebar-collapsed .sidebar {
    flex-basis:0;
    width:0;
    padding-left:0;
    padding-right:0;
    border-right-width:0;
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:flex-basis .24s ease, width .24s ease, padding .24s ease, border-width .24s ease, opacity .2s ease, visibility 0s linear .24s;
  }
}

@media(prefers-reduced-motion:reduce) {
  .sidebar,
  .sidebar-toggle {
    transition:none !important;
  }
}

.knowledge-header {
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
}

.knowledge-header h2 {
  margin:0;
  font-size:20px;

}

.knowledge-actions {
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:8px;
}

.knowledge-list {

  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));

  min-height:40vh;
}

.knowledge-card {

}

.knowledge-card:hover {

}

.knowledge-card-title {
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
  overflow-wrap:anywhere;
}

.knowledge-card-excerpt {
  color:var(--muted);
  font-size:11px;
  line-height:1.45;
  max-height:54px;

  white-space:pre-wrap;

}

.knowledge-card-meta {

  gap:8px;
  margin-top:10px;
  color:#898da7;
  font-size:10px;
}

.kn-editor {
  display:flex;
  flex-direction:column;
  gap:8px;
}

.kn-editor .comment-field {
  min-height:260px;
  max-height:52vh;
  border-radius:0 0 10px 10px;
}

.kn-save-row {
  display:flex;
  justify-content:flex-end;
  padding-top:4px;
}

@media(max-width:980px) {
  .sidebar {
    position:fixed;
    z-index:70;
    left:0;
    top:0;
    bottom:0;
    transform:translateX(-100%);
    transition:transform .18s ease;
    box-shadow:20px 0 60px #0008;
  }

  body.sidebar-open .sidebar {
    transform:none;
  }

  body.sidebar-open::after {
    content:"";
    position:fixed;
    inset:0;
    z-index:65;
    background:#080910aa;
    backdrop-filter:blur(3px);
  }

  .sidebar-toggle,
  .sidebar-close {
    display:inline-grid;
    place-items:center;
  }

  /* На узком экране панель выезжает поверх, там нужна только кнопка ✕. */
  .sidebar-collapse {
    display:none;
  }

  .knowledge-header {
    flex-direction:column;
  }

  .knowledge-actions {
    width:100%;
  }

  .knowledge-actions input {
    flex:1;
  }
}

html[data-resolved-theme="light"] {

/* ---------- Этап 6: окно настроек темы ---------- */

.theme-settings {
  display:flex;
  flex-direction:column;
  gap:14px;
}

.theme-mode-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
  gap:8px;
}

.theme-mode-btn {
  padding:9px 10px;
  border:1px solid var(--border);
  border-radius:10px;
  color:var(--text);
  background:var(--panel2);
  font-size:12px;
}

.theme-mode-btn:hover {
  border-color:var(--accent);
}

.theme-mode-btn.active {
  border-color:var(--accent);
  background:var(--accent-soft);
  font-weight:750;
}

.theme-custom-panel {
  display:flex;
  flex-direction:column;
  gap:12px;
  padding:12px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--surface-toolbar);
}

.theme-color-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:10px;
}

.theme-color {
  display:flex;
  flex-direction:column;
  gap:5px;
  color:var(--muted);
  font-size:11px;
}

.theme-color input[type="color"] {
  width:100%;
  height:34px;
  padding:3px;
  border:1px solid var(--border);
  border-radius:9px;
  background:var(--input-bg);
  cursor:pointer;
}

.theme-actions-row {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.theme-warning {
  padding:9px 11px;
  border:1px solid var(--warning-bd);
  border-radius:10px;
  color:var(--warning-fg);
  background:var(--warning-bg);
  font-size:12px;
  line-height:1.45;
}

.theme-preview {
  padding-top:4px;
}

.theme-preview-card {
  padding:14px;
  border:1px solid var(--border);
  border-radius:14px;
  background:var(--surface-task);
}

.theme-preview-title {
  margin-bottom:8px;
  color:var(--text);
  font-size:13px;
  font-weight:750;
}

.theme-preview-tags {
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-bottom:9px;
}

.theme-preview-text {
  margin-bottom:10px;
  color:var(--muted);
  font-size:12px;
  line-height:1.45;
}


/* ---------- Окно «Свойства» ---------- */
.pm-top { margin-bottom:12px; }
.pm-new {
  padding:12px; border:1px solid var(--border); border-radius:12px; background:var(--panel2);
}
.pm-new-row { display:flex; gap:8px; margin-bottom:8px; }
.pm-new-row .field { flex:1; min-width:0; }
.pm-new textarea { width:100%; margin-bottom:8px; resize:vertical; }
.pm-new-actions { display:flex; flex-wrap:wrap; gap:8px; }
.pm-list { display:flex; flex-direction:column; gap:6px; }
.pm-row {
  border:1px solid var(--border); border-radius:12px; background:var(--panel2);
  transition:border-color .12s;
}
.pm-row.drop-target { border-color:var(--accent); }
.pm-main { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:6px 8px; }
.pm-main .grip { cursor:grab; color:var(--muted); }
.pm-title { flex:1 1 150px; min-width:120px; }
.pm-type { min-width:84px; color:var(--muted); font-size:11px; }
.pm-type-sel { width:auto; min-width:120px; }
.pm-vis { min-width:84px; color:var(--muted); }
