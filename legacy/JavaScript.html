<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const FILTERS = [
['filterFlow', 'флоу', 'Все флоу'],
['filterAssignee', 'исполнитель', 'Все исполнители'],
['filterDeveloper', 'разраб', 'Все разработчики'],
['filterCategory', 'категория', 'Все категории'],
['filterVersion', 'версия', 'Все версии']
];
// Стиль пилюль по умолчанию для известных полей (пока цвет значения не назначен).
const PILL_STYLES = {
'статус': 'status', 'флоу': 'flow', 'категория': 'category',
'исполнитель': 'assignee', 'разраб': 'developer',
'версия': 'version', 'дата выкатки': 'date'
};
const pillStyle = key => PILL_STYLES[key] || 'generic';
// Эти поля редактируются отдельно (шапка и основной текст).
const SPECIAL_KEYS = ['задача', 'номер', 'коммент'];
// Палитра значений: [ключ, название, цвет для точки на доске].
const COLOR_LIST = [
['red', 'Красный', '#f49aaa'],
['orange', 'Оранжевый', '#f4c58b'],
['yellow', 'Жёлтый', '#f0dc82'],
['green', 'Зелёный', '#8fe0bd'],
['blue', 'Синий', '#9bc5ff'],
['purple', 'Фиолетовый', '#d0baff'],
['pink', 'Розовый', '#f2b0d3'],
['gray', 'Серый', '#b3b6c8']
];
const COLOR_HEX = Object.fromEntries(COLOR_LIST.map(c => [c[0], c[2]]));
const COLORS = ['#b7a5ff','#83e5ed','#8fe0bd','#f4c58b','#f49aaa','#9bc5ff','#d0baff','#83e4d5'];
const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const WEEKDAYS = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const MAX_RETRIES = 5;
const FS_KEY = 'qaflow.editorFullscreen';
const PROPS_KEY = 'qaflow.propsCollapsed';
const VIEW_KEY = 'qaflow.activeView';
const BOARD_UI_KEY = 'qaflow.boardUi';
const EXPORT_KEY = 'qaflow.export';
const SECTION_KEY = 'qaflow.activeSection';
const SHOW_ARCHIVED_KEY = 'qaflow.showArchived';

let sheetId = null;
let sheetName = '';
let schema = [];
let tasks = [];
let statuses = [];
let dropdownOptions = {};
let colors = {};        // { ключ свойства: { значение: цвет } }
let lastSignature = '';
let lastSyncAt = '';
let boardUi = readBoardUi();   // личный вид доски на этом устройстве: свёрнутые столбцы и компактные карточки
let propConfig = { order: [], hidden: [], titles: {}, types: {}, options: {} };   // настройки свойств листа
let loading = false;
let pending = 0;      // записей сейчас в пути
let writeEpoch = 0;   // растёт при каждой записи: устаревшие загрузки отбрасываются
let noticeTimer = null;
let openMenu = null;
let colorChain = Promise.resolve();
let fullscreen = false;
let propsCollapsed = false;
let views = [];                 // сохранённые представления (с сервера)
let activeViewId = 'all';
let draft = { filters: { search: '', values: {}, text: {}, dates: {} }, sort: { key: '', dir: 'asc' } };
let draftReady = false;         // черновик: фильтры и сортировка до сохранения в представление
let modal = null;

// Этап 5: рабочая область, доски и базы знаний.
let workspace = { boards: [], knowledge: [] };
let activeSection = { type: 'board', id: null };
let knowledgeData = null;
let knowledgeArticles = [];
let knowledgeSearch = '';
let showArchived = false;
// Состояние загрузки рабочей области и защита от устаревших ответов сервера.
let workspaceState = 'loading';   // loading | ready | error
let workspaceError = '';
let workspaceSeq = 0;             // растёт при каждом применении списка: старый ответ его не затрёт
let workspaceRefreshing = false;
let loadToken = 0;                // номер последнего запроса доски
let knowledgeToken = 0;           // номер последнего запроса базы знаний
let boardLoadedFor = null;        // sheetId, данные которого сейчас на экране
let boardNeedsLoad = false;       // выбранная доска ещё не загружена

const controls = new Map();
const rich = $('taskComment');
const editor = {
open: false, mode: 'create', task: null, values: {}, initial: {},
timer: null, retry: null, retries: 0,
inFlight: false, closeRequested: false, requestId: '',
linkForm: null, linkRange: null, linkAnchor: null
};

const knEditor = {
open: false,
mode: 'create',
article: null,
title: '',
content: '',
rev: 0,   // растёт при каждом вводе пользователя: по нему отличаем «текст не менялся» от «печатали во время запроса»
inFlight: false,
closeRequested: false,
retries: 0,
requestId: '',
timer: null,
retry: null,
modal: null,
titleEl: null,
contentEl: null,
statusEl: null,
linkForm: null,
linkRange: null,
linkAnchor: null
};

/* ---------- Помощники ---------- */
function esc(value) {
return String(value ?? '').replace(/[&<>"']/g, ch => ({
'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
})[ch]);
}
// Ссылки. Открываем только http(s): так из таблицы в браузер не попадёт javascript: и подобное.
// Правила совпадают с normalizeUrl_ в Code.gs: адрес без протокола получает https:/.
const HTTP_URL_RE = /^https?:\/\/\S+$/i;
function normalizeUrlInput(text) {
const s = String(text ?? '').trim();
if (!s) return '';
if (HTTP_URL_RE.test(s)) return s;
if (/^[^\s@\/:]+(\.[^\s@\/:]+)+(:\d+)?([\/?#]\S*)?$/.test(s) && /\.[A-Za-z]{2,}(?=[:\/?#]|$)/.test(s)) return 'https:\u002f\u002f' + s;
return null;
}
// Готовый адрес для href либо пустая строка, если значение не ссылка.
function safeHref(value) {
const s = String(value ?? '').trim();
if (!HTTP_URL_RE.test(s)) return '';
try { return new URL(s).href; } catch (e) { return ''; }
}
function gs(name, ...args) {
return new Promise((resolve, reject) => {
google.script.run
.withSuccessHandler(resolve)
.withFailureHandler(reject)[name](...args);
});
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
const timeNow = () => new Date().toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' });
const errText = error => error?.message || String(error);
const pad2 = n => String(n).padStart(2, '0');
const isIso = v => /^\d{4}-\d{2}-\d{2}$/.test(v || '');
const isoOf = (y, m, d) => `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
const fmtDate = v => isIso(v) ? `${v.slice(8, 10)}.${v.slice(5, 7)}.${v.slice(0, 4)}` : (v || '');
function showNotice(message, error = false) {
const el = $('notice');
el.textContent = message;
el.className = 'notice show' + (error ? ' error' : '');
clearTimeout(noticeTimer);
noticeTimer = setTimeout(() => { el.className = 'notice'; }, 4000);
}
function setSync(message, state = '') {
const el = $('syncLabel');
el.textContent = message;
el.className = 'sync-label' + (state ? ' ' + state : '');
}
function handleError(error) {
setSync('Ошибка синхронизации', 'error');
showNotice(errText(error), true);
}
function beginWrite() {
pending++;
writeEpoch++;
setSync('Сохранение…', 'saving');
}
function endWrite(failed = false) {
pending = Math.max(0, pending - 1);
if (failed) setSync('Ошибка сохранения', 'error');
else if (pending === 0) setSync('Сохранено в ' + timeNow(), 'ok');
}

/* ---------- Форматированный текст ---------- */
// Хранение: без форматирования — обычный текст; с форматированием — HTML
// из белого списка тегов (b, i, u, s, ul, ol, li, div, br) без атрибутов.
// Серверная очистка в Code.gs работает по тем же правилам.
const HAS_TAGS = /<\/?(b|strong|i|em|u|s|strike|del|ul|ol|li|br|div|p|a)\b[^>]*>/i;
const RICH_MAP = {
B:'b', STRONG:'b', I:'i', EM:'i', U:'u', S:'s', STRIKE:'s', DEL:'s',
UL:'ul', OL:'ol', LI:'li', DIV:'div', P:'div'
};
const isRichKey = key => schema.some(p => p.key === key && p.type === 'longtext');
// Пробелы не заменяем на &nbsp;: поля описания работают в режиме pre-wrap,
// поэтому обычные пробелы сохраняются, а текст нормально переносится по словам.
function escText(text) {
return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
.replace(new RegExp(String.fromCharCode(160), 'g'), ' ');
}

const escAttr = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;')
.replace(/</g, '&lt;').replace(/>/g, '&gt;');
const MAX_LINK_LENGTH = 2000;
const CTRL_CHARS_RE = new RegExp('[' + String.fromCharCode(0) + '-' + String.fromCharCode(31) + String.fromCharCode(127) + ']');
// Адрес ссылки или null. Правила те же, что в Code.gs: только http(s), адрес без протокола получает https:/.
function linkUrlOrNull(value) {
const s = String(value ?? '').trim();
if (!s || s.length > MAX_LINK_LENGTH || CTRL_CHARS_RE.test(s)) return null;
return normalizeUrlInput(s) || null;
}
const safeLinkHref = raw => linkUrlOrNull(raw) || '';
// При показе ссылки открываются в новой вкладке и не открывают карточку задачи.
function decorateLinks(html) {
return html.replace(/<a href=/g, '<a target="_blank" rel="noopener noreferrer" draggable="false" data-link href=');
}
// Разбирает HTML в неактивном шаблоне и собирает заново только разрешённые теги.
function toSafeHtml(html) {
const tpl = document.createElement('template');
tpl.innerHTML = html;
const walk = (node, inLink) => {
let out = '';
node.childNodes.forEach(n => {
if (n.nodeType === 3) {
out += escText(n.nodeValue);
} else if (n.nodeType === 1) {
const tag = n.tagName;
if (tag === 'SCRIPT' || tag === 'STYLE') return;
if (tag === 'BR') { out += '<br>'; return; }
if (tag === 'A') {
const href = inLink ? '' : safeLinkHref(n.getAttribute('href'));
const inner = walk(n, true);
out += href ? `<a href="${escAttr(href)}">${inner}</a>` : inner;
return;
}
const mapped = RICH_MAP[tag];
const inner = walk(n, inLink);
out += mapped ? `<${mapped}>${inner}</${mapped}>` : inner;
}
});
return out;
};
return walk(tpl.content, false);
}
function simplifyHtml(html) {
if (/<\/?(?:b|i|u|s|ul|ol|li)>|<a href=|<\/a>/.test(html)) return html;
let text = html
.replace(/<div><br><\/div>/g, '<div></div>')
.replace(/<div>/g, '\n')
.replace(/<\/div>/g, '')
.replace(/<br>/g, '\n')
.replace(/&nbsp;/g, ' ')
.replace(/&lt;/g, '<')
.replace(/&gt;/g, '>')
.replace(/&amp;/g, '&');
text = text.replace(/^\n/, '').replace(/\n+$/, '');
if (/[<>]/.test(text)) return HAS_TAGS.test(html) ? html : '<div>' + html + '</div>';
return text;
}
// Каноническая форма значения: именно так оно хранится в таблице.
function richCanon(value) {
const s = String(value ?? '');
if (!s.trim()) return '';
if (!HAS_TAGS.test(s)) return s;
const html = toSafeHtml(s);
const visibleEmpty = !/<li>/.test(html) &&
html.replace(/<[^>]*>/g, '').replace(/&nbsp;/g, ' ').trim() === '';
return visibleEmpty ? '' : simplifyHtml(html);
}
// HTML для показа (редактор и карточка на доске).
function richToHtml(value) {
const s = String(value ?? '');
if (!s.trim()) return '';
if (HAS_TAGS.test(s)) return decorateLinks(toSafeHtml(s));
return s.replace(/\r\n?/g, '\n').split('\n')
.map(line => line ? `<div>${escText(line)}</div>` : '<div><br></div>')
.join('');
}
function richPlain(value) {
const s = String(value ?? '');
return HAS_TAGS.test(s)
? toSafeHtml(s).replace(/<\/(div|li)>|<br>/g, ' ').replace(/<[^>]*>/g, '')
.replace(/&nbsp;/g, ' ').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&')
: s;
}
// Сравнение значений с учётом того, что у форматированного текста
// одно и то же содержимое может быть записано по-разному.
function same(key, a, b) {
const x = a ?? '';
const y = b ?? '';
if (x === y) return true;
return isRichKey(key) && richCanon(x) === richCanon(y);
}

/* ---------- Цвета значений ---------- */
const colorOf = (key, value) => {
const map = colors[key];
return map && Object.prototype.hasOwnProperty.call(map, value) ? map[value] : '';
};
// Назначенный цвет перекрывает цвет поля по умолчанию.
function pillClass(key, value) {
const color = colorOf(key, value);
return color ? 'c-' + color : 'pill-' + pillStyle(key);
}
function applyColor(key, value, color) {
if (color) {
if (!colors[key]) colors[key] = {};
colors[key][value] = color;
} else if (colors[key]) {
delete colors[key][value];
if (!Object.keys(colors[key]).length) delete colors[key];
}
}
function repaintColors(key) {
renderBoard();
renderPropsSummary();
const p = schema.find(item => item.key === key);
if (p && controls.has(key) && editor.open) renderPicker(p);
if (openMenu && openMenu.key === key) {
openMenu.menu.querySelectorAll('[data-row]').forEach(row => {
const pill = row.querySelector('.value-pill');
if (pill) pill.className = 'value-pill ' + pillClass(key, row.dataset.row);
});
}
}
function setValueColor(key, value, color) {
const previous = colorOf(key, value);
if (previous === color) return;
applyColor(key, value, color);
repaintColors(key);
beginWrite();
colorChain = colorChain.catch(() => {})
.then(() => gs('saveValueColor', sheetId, key, value, color))
.then(
() => { endWrite(); },
error => {
endWrite(true);
if (colorOf(key, value) === color) {
applyColor(key, value, previous);
repaintColors(key);
}
showNotice(errText(error), true);
}
);
}

/* ---------- Загрузка доски ---------- */
function attachBase(task) {
task._base = {};
schema.forEach(p => { task._base[p.key] = task[p.key] ?? ''; });
return task;
}
function editorBusy() {
return editor.open && (editor.inFlight || isDirty());
}
// force: загрузка после переключения доски. Она заменяет любой запрос, который ещё в пути,
// иначе ответ по прежней доске подменял бы выбранную.
function loadBoard(manual = false, force = false) {
if (loading && !force) return;
if (pending > 0 || editor.inFlight) {
if (manual) showNotice('Изменения ещё сохраняются — обнови чуть позже.');
// Выбранная доска ещё не показана: повторяем, как только запись завершится.
if (boardNeedsLoad) setTimeout(() => loadBoard(false, true), 400);
return;
}
loading = true;
const token = ++loadToken;
const requestedId = sheetId;
const epoch = writeEpoch;
setSync('Синхронизация…', 'saving');
return gs('getBoardData', sheetId)
.then(data => {
// Пришёл ответ на устаревший запрос (доску уже переключили): игнорируем.
if (token !== loadToken) return;
loading = false;
if (activeSection.type !== 'board') return;
if (requestedId !== null && requestedId !== undefined && Number(data.sheetId) !== Number(requestedId)) return;
// Пока шла загрузка, что-то сохранялось: ответ может быть устаревшим.
if (epoch !== writeEpoch || pending > 0) {
if (boardNeedsLoad) setTimeout(() => loadBoard(false, true), 400);
return;
}
sheetId = data.sheetId;
sheetName = data.sheetName || '';
boardLoadedFor = data.sheetId;
boardNeedsLoad = false;
const signature = JSON.stringify([
data.schema, data.tasks, data.statuses, data.dropdownOptions, data.colors, data.views, data.propConfig
]);
if (signature !== lastSignature) {
lastSignature = signature;
schema = data.schema || [];
statuses = data.statuses || [];
dropdownOptions = data.dropdownOptions || {};
colors = data.colors || {};
propConfig = data.propConfig || propConfig;
tasks = (data.tasks || []).map(attachBase);
// Несохранённые правки фильтров пользователя не затираем обновлением.
let keepDraft = draftReady && isDraftDirty();
views = (data.views || []).map(fromServerView);
if (!allViews().some(v => v.id === activeViewId)) {
activeViewId = 'all';
keepDraft = false;
}
if (!keepDraft) initDraft();
renderAll();
mergeIntoEditor();
}
lastSyncAt = timeNow();
setSync('Обновлено в ' + lastSyncAt, 'ok');
})
.catch(error => {
if (token !== loadToken) return;
loading = false;
handleError(error);
// Доска ещё ни разу не загружалась: вместо вечного «Загружаем…» показываем ошибку и повтор.
if (boardLoadedFor !== requestedId) {
$('board').innerHTML = `<div class="loading">Не удалось загрузить доску: ${esc(errText(error))} <button class="btn small" type="button" data-board-retry>Повторить</button></div>`;
}
});
}

/* ---------- Представления: состояние ---------- */
// Представление хранит только настройки отображения: фильтры, столбцы,
// поля карточки, сортировку. Задачи у всех представлений одни и те же.
// Фильтры и сортировка правятся в «черновике» и сохраняются явно;
// столбцы и поля карточки сохраняются из окна «Настроить вид».
//
// Внутри клиента фильтры хранятся как { search, values, text, dates },
// на сервере — в каноническом виде (см. Code.gs). Перевод между ними
// делают fromServerView / toServerView.
const EMPTY_TOKEN = '__empty__';   // «не заполнено» в фильтре по значениям
const NO_STATUS = 'Без статуса';
const DEFAULT_CARD_PROPS = ['флоу', 'категория', 'версия', 'дата выкатки', 'коммент', 'исполнитель', 'разраб'];
const CARD_BOTTOM = ['исполнитель', 'разраб'];
const TYPE_LABELS = { select: 'Список', date: 'Дата', text: 'Текст', url: 'Ссылка', longtext: 'Длинный текст' };
const clone = value => JSON.parse(JSON.stringify(value));
const isObj = v => !!v && typeof v === 'object' && !Array.isArray(v);
const newViewId = () => 'v' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
const blankFilters = () => ({ search: '', values: {}, text: {}, dates: {} });
function normFilters(f) {
const src = isObj(f) ? f : {};
return {
search: String(src.search || ''),
values: isObj(src.values) ? src.values : {},
text: isObj(src.text) ? src.text : {},
dates: isObj(src.dates) ? src.dates : {}
};
}
// Приводит представление в клиентском формате к цельному виду.
function fixView(raw) {
const v = raw || {};
const c = v.columns || {};
const s = v.sort || {};
return {
id: String(v.id || ''),
name: String(v.name || 'Без названия'),
pos: v.pos == null || !Number.isFinite(Number(v.pos)) ? undefined : Number(v.pos),
virtual: !!v.virtual,
filters: normFilters(v.filters),
columns: {
order: Array.isArray(c.order) ? c.order : [],
hidden: Array.isArray(c.hidden) ? c.hidden : []
},
props: Array.isArray(v.props) ? v.props : null,
sort: { key: s.key || '', dir: s.dir === 'desc' ? 'desc' : 'asc' }
};
}
// Сервер отдаёт: filters = { "ключ": ["значение"] | { from, to } },
// search и text — на верхнем уровне, cardProps вместо props, sort может быть null.
function fromServerView(raw) {
const v = raw || {};
const src = isObj(v.filters) ? v.filters : {};
const filters = blankFilters();
filters.search = String(v.search || '');
if (isObj(v.text)) filters.text = { ...v.text };
Object.keys(src).forEach(key => {
const f = src[key];
if (Array.isArray(f)) filters.values[key] = f.slice();
else if (isObj(f)) filters.dates[key] = { from: f.from || '', to: f.to || '' };
});
return fixView({
id: v.id, name: v.name, pos: v.pos, filters,
columns: v.columns, props: v.cardProps, sort: v.sort
});
}
function toServerView(view) {
const f = view.filters;
const filters = {};
Object.keys(f.values).forEach(key => {
const list = (f.values[key] || []).filter(x => x !== '');
if (list.length) filters[key] = list;
});
Object.keys(f.dates).forEach(key => {
const d = f.dates[key] || {};
if (d.from || d.to) filters[key] = { from: d.from || '', to: d.to || '' };
});
const out = {
id: view.id,
name: view.name,
filters,
columns: view.columns,
sort: view.sort.key ? { key: view.sort.key, dir: view.sort.dir } : null,
cardProps: view.props
};
// pos сохраняем: без него сервер каждый раз ставит «сейчас», и вкладка прыгает в конец.
if (view.pos !== undefined) out.pos = view.pos;
const search = String(f.search || '').trim();
if (search) out.search = search;
const text = {};
Object.keys(f.text).forEach(key => {
const s = String(f.text[key] || '').trim();
if (s) text[key] = s;
});
if (Object.keys(text).length) out.text = text;
return out;
}
// «Все задачи» есть всегда: пока её не сохранили, она виртуальная.
function allViews() {
const all = views.find(v => v.id === 'all') || fixView({ id: 'all', name: 'Все задачи', virtual: true });
return [all, ...views.filter(v => v.id !== 'all')];
}
function currentView() {
const list = allViews();
return list.find(v => v.id === activeViewId) || list[0];
}
function viewStorageKey(id) {
return VIEW_KEY + '.' + (id || 'default');
}
function saveActiveLocal() {
try { localStorage.setItem(viewStorageKey(sheetId), activeViewId); } catch (e) { /* не критично */ }
}
function loadActiveLocal(id) {

function initDraft() {

// Каноническая запись фильтров и сортировки: по ней понимаем, менялся ли черновик.
function canonState(filters, sort) {
const out = {
search: String(filters.search || '').trim(),
values: {}, text: {}, dates: {},
sort: { key: sort.key || '', dir: sort.key ? sort.dir : 'asc' }
};
Object.keys(filters.values || {}).sort().forEach(key => {
const list = [...new Set((filters.values[key] || []).filter(x => x !== ''))].sort();
if (list.length) out.values[key] = list;
});
Object.keys(filters.text || {}).sort().forEach(key => {
const s = String(filters.text[key] || '').trim();
if (s) out.text[key] = s;
});
Object.keys(filters.dates || {}).sort().forEach(key => {
const d = filters.dates[key] || {};
if (d.from || d.to) out.dates[key] = { from: d.from || '', to: d.to || '' };
});
return JSON.stringify(out);
}
function isDraftDirty() {
if (!draftReady) return false;
const v = currentView();
return canonState(draft.filters, draft.sort) !== canonState(v.filters, v.sort);
}
const hasProp = key => schema.some(p => p.key === key);
function activeFilterCount() {
const f = draft.filters;
return Object.keys(f.values).filter(k => hasProp(k) && f.values[k].length).length
+ Object.keys(f.text).filter(k => hasProp(k) && String(f.text[k]).trim()).length
+ Object.keys(f.dates).filter(k => hasProp(k) && (f.dates[k].from || f.dates[k].to)).length;
}

/* ---------- Фильтрация, сортировка, столбцы ---------- */
// Одно условие показа. Внутри свойства значения объединяются по «или»,
// разные свойства — по «и». Используется и доской, и экспортом.
function matchTask(task, f) {
const query = String(f.search || '').trim().toLocaleLowerCase('ru');
if (query) {
const searchable = Object.keys(task)
.filter(key => !key.startsWith('_'))
.map(key => isRichKey(key) ? richPlain(task[key]) : (task[key] || ''))
.join(' ')
.toLocaleLowerCase('ru');
if (!searchable.includes(query)) return false;
}
for (const key of Object.keys(f.values)) {
const list = f.values[key];
if (!list.length || !hasProp(key)) continue;
const value = String(task[key] || '').trim();
if (!list.some(x => x === EMPTY_TOKEN ? value === '' : x === value)) return false;
}
for (const key of Object.keys(f.text)) {
const needle = String(f.text[key] || '').trim().toLocaleLowerCase('ru');
if (!needle || !hasProp(key)) continue;
const hay = isRichKey(key) ? richPlain(task[key]) : String(task[key] || '');
if (!hay.toLocaleLowerCase('ru').includes(needle)) return false;
}
for (const key of Object.keys(f.dates)) {
const range = f.dates[key] || {};
if (!(range.from || range.to) || !hasProp(key)) continue;
const d = task[key];
if (!isIso(d)) return false;
if (range.from && d < range.from) return false;
if (range.to && d > range.to) return false;
}
return true;
}
const getFilteredTasks = () => tasks.filter(t => matchTask(t, draft.filters));
// Пустые значения всегда внизу, независимо от направления.
function sortTasks(list) {
const { key, dir } = draft.sort;
if (!key || !hasProp(key)) return list;
const mul = dir === 'desc' ? -1 : 1;
const text = t => String(t[key] ?? '').trim();
return list.slice().sort((a, b) => {
const x = text(a);
const y = text(b);
if (!x && !y) return 0;
if (!x) return 1;
if (!y) return -1;
return x.localeCompare(y, 'ru', { numeric: true }) * mul;
});
}
// Статусы доски: из списка + «Без статуса», если такие задачи есть.
function allStatuses() {
const list = statuses.slice();
if (tasks.some(t => !String(t['статус'] || '').trim()) && !list.includes(NO_STATUS)) list.push(NO_STATUS);
return list;
}
// Порядок и видимость столбцов-статусов. Новые статусы из таблицы
// появляются в конце видимых, скрытые остаются скрытыми.
function laneOrder(view) {
const known = allStatuses();
const hidden = new Set(view.columns.hidden);
const order = view.columns.order.filter(s => known.includes(s));
const ordered = [...order, ...known.filter(s => !order.includes(s))];
return {
order: ordered,
active: ordered.filter(s => !hidden.has(s)),
hidden: ordered.filter(s => hidden.has(s))
};
}
function defaultCardProps() {
return schema.map(p => p.key).filter(k => DEFAULT_CARD_PROPS.includes(k));
}
function cardProps(view) {
const present = schema.map(p => p.key);
const keys = Array.isArray(view.props) ? view.props : DEFAULT_CARD_PROPS;
return new Set(keys.filter(k => present.includes(k)));
}
function laneColor(status, index) {
const assigned = colorOf('статус', status);
return assigned ? COLOR_HEX[assigned] : COLORS[index % COLORS.length];
}

/* ---------- Быстрые фильтры в шапке ---------- */
function populateFilters() {

// Быстрый фильтр показывается только для столбца, который есть в таблице.

: (dropdownOptions[field] || []);
[...values].sort((a, b) => a.localeCompare(b, 'ru', { numeric: true })).forEach(value => {

function syncQuickSelects() {
FILTERS.forEach(([id, field, label]) => {

const multi = [...select.options].find(o => o.value === '__multi');

/* ---------- Модальные окна ---------- */
function showModal({ title, width = 460, body = '', actions = [] }) {
if (modal) modal.close(undefined);
const overlay = $('modalOverlay');
const box = $('modalBox');
box.style.width = `min(${width}px,100%)`;
box.innerHTML = `
<div class="modal-head">
<div class="modal-title" id="modalTitle">${esc(title)}</div>
<button class="icon-btn" type="button" data-modal-close aria-label="Закрыть">✕</button>
</div>
<div class="modal-body">${body}</div>
<div class="modal-foot">${actions.map((a, i) =>
`<button type="button" class="btn${a.kind ? ' ' + a.kind : ''}" data-action="${i}">${esc(a.label)}</button>`
).join('')}</div>
`;
const bodyEl = box.querySelector('.modal-body');
const foot = box.querySelector('.modal-foot');
let finish;
let closed = false;
const promise = new Promise(resolve => { finish = resolve; });
const close = value => {
if (closed) return;
closed = true;
overlay.classList.remove('open');
overlay.setAttribute('aria-hidden', 'true');
box.innerHTML = '';
modal = null;
finish(value);
};
const setBusy = busy => foot.querySelectorAll('button').forEach(b => { b.disabled = busy; });
foot.addEventListener('click', async event => {
const button = event.target.closest('[data-action]');
if (!button) return;
const action = actions[Number(button.dataset.action)];
if (!action.onClick) { close(action.value); return; }
setBusy(true);
try {
const result = await action.onClick();
if (result !== false) {
close(result === undefined ? action.value : result);
return;
}
} catch (error) {
showNotice(errText(error), true);
}
if (!closed) setBusy(false);
});
box.querySelector('[data-modal-close]').addEventListener('click', () => close(undefined));
overlay.classList.add('open');
overlay.setAttribute('aria-hidden', 'false');
modal = { close, box };
return { body: bodyEl, box, close, promise };
}
function askName(title, initial = '', okLabel = 'Сохранить', maxLength = 40) {

body: `<label class="modal-label" for="modalName">Название</label>
<input id="modalName" class="field" maxlength="${maxLength}" autocomplete="off" value="${esc(initial)}">`,

if (knEditor.open && (knEditor.inFlight || knDirty())) {
showNotice('Сначала дождись сохранения или закрой статью.', true);
return;
}
if (knEditor.open) closeKnowledgeEditorNow();

if (activeSection.type === 'board' && draftReady && isDraftDirty()) {
if (!(await guardDraft())) return;
}

closeMenu();
activateSection(type, id);
}
function activateSection(type, id) {
id = Number(id);
activeSection = { type, id };
saveActiveSection();
renderSidebar();

const isBoard = type === 'board';
$('boardView').hidden = !isBoard;
$('knowledgeView').hidden = isBoard;
$('newTaskBtn').hidden = !isBoard;
document.body.classList.remove('sidebar-open');
syncSidebarToggle();

if (isBoard) {
// Данные прежней доски и базы знаний не должны оставаться на экране.
knowledgeToken++;
knowledgeData = null;
knowledgeArticles = [];
sheetId = id;
activeViewId = loadActiveLocal(id);
draftReady = false;
lastSignature = '';
tasks = [];
boardLoadedFor = null;
boardNeedsLoad = true;
$('viewTabs').innerHTML = '';
$('stats').innerHTML = '';
$('board').innerHTML = '<div class="loading">Загружаем задачи…</div>';
loadBoard(false, true);
} else {
// Ответ по прежней доске, если он ещё в пути, отбрасывается.
loadToken++;
loading = false;
boardNeedsLoad = false;
boardLoadedFor = null;
sheetId = null;
tasks = [];
lastSignature = '';
const item = findWorkspaceItem('knowledge', id);
$('knowledgeTitle').textContent = item ? item.name : 'База знаний';
$('knowledgeStats').innerHTML = '';
$('knowledgeBoard').innerHTML = '<div class="loading">Загружаем статьи…</div>';
loadKnowledge(id);
}
}
async function addBoard() {
const name = await askName('Новая доска', 'Доска', 'Создать');
if (!name) return;
try {
const res = await gs('createBoard', name);
applyWorkspace(res.workspace);
activateSection('board', res.id);
showNotice('Доска создана');
} catch (error) {
showNotice(errText(error), true);
}
}
async function addKnowledge() {
const name = await askName('Новая база знаний', 'База знаний', 'Создать');
if (!name) return;
try {
const res = await gs('createKnowledge', name);
applyWorkspace(res.workspace);
activateSection('knowledge', res.id);
showNotice('База знаний создана');
} catch (error) {
showNotice(errText(error), true);
}
}
async function renameSection(type, id) {
const item = findWorkspaceItem(type, id);
if (!item) return;
const name = await askName('Переименовать', item.name);
if (!name || name === item.name) return;
try {
const res = await gs('renameWorkspaceItem', id, name);
applyWorkspace(res.workspace);
renderSidebar();
if (activeSection.type === type && activeSection.id === Number(id)) {
if (type === 'board') loadBoard(true);
else loadKnowledge(id);
}
showNotice('Переименовано');
} catch (error) {
showNotice(errText(error), true);
}
}
async function archiveSection(type, id) {
const item = findWorkspaceItem(type, id);
if (!item) return;
const wasArchived = item.archived;
try {
const res = await gs('setWorkspaceArchived', id, !wasArchived);
applyWorkspace(res.workspace);
renderSidebar();

if (activeSection.type === type && activeSection.id === Number(id) && !wasArchived) {
const fallback = firstActiveBoard() || firstActiveKnowledge();
if (fallback) {
const fallbackType = workspace.boards.includes(fallback) ? 'board' : 'knowledge';
activateSection(fallbackType, fallback.id);
}
}

showNotice(wasArchived ? 'Возвращено из архива' : 'Отправлено в архив');
} catch (error) {
showNotice(errText(error), true);
}
}
async function deleteSection(type, id) {
const item = findWorkspaceItem(type, id);
if (!item) return;
if (!item.createdByApp) {
showNotice('Можно удалять только доски и базы знаний, созданные в приложении.', true);
return;
}

const ok = await confirmDialog(
'Удалить навсегда?',
`«${item.name}» будет удалено вместе с листом. Это действие нельзя отменить.`,
'Удалить',
true
);
if (!ok) return;

try {
const res = await gs('deleteWorkspaceItem', id);
applyWorkspace(res.workspace);
renderSidebar();

if (activeSection.type === type && activeSection.id === Number(id)) {
const fallback = firstActiveBoard() || firstActiveKnowledge();
if (fallback) {
const fallbackType = workspace.boards.includes(fallback) ? 'board' : 'knowledge';
activateSection(fallbackType, fallback.id);
}
}

showNotice('Удалено');
} catch (error) {
showNotice(errText(error), true);
}
}
// Применяет список, пришедший с сервера (после создания, переименования, архивации, удаления).
function applyWorkspace(ws) {
if (!ws || !Array.isArray(ws.boards) || !Array.isArray(ws.knowledge)) return;
workspaceSeq++;
workspace = ws;
workspaceState = 'ready';
}
// Тихо перечитывает список с сервера: новые, переименованные и удалённые листы появляются без перезагрузки страницы.
async function refreshWorkspace() {
if (workspaceState !== 'ready' || workspaceRefreshing) return;
workspaceRefreshing = true;
const seq = workspaceSeq;
try {
const ws = await gs('getWorkspace');
// Пока шёл запрос, список обновила другая операция: её данные новее.
if (seq !== workspaceSeq) return;
applyWorkspace(ws);
renderSidebar();
const current = findWorkspaceItem(activeSection.type, activeSection.id);
if (!current && !uiBusy() && pending === 0) {
// Выбранный лист удалили снаружи: переходим на доступный.
const fallback = firstActiveBoard() || firstActiveKnowledge();
if (fallback) activateSection(workspace.boards.includes(fallback) ? 'board' : 'knowledge', fallback.id);
}
} catch (error) {
/* фоновое обновление не мешает работе: следующая попытка будет позже */
} finally {
workspaceRefreshing = false;
}
}
async function initWorkspace() {
workspaceState = 'loading';
workspaceError = '';
renderSidebar();
setSync('Подключение…', 'saving');
try {
const ws = await gs('getWorkspace');
if (!ws || !Array.isArray(ws.boards) || !Array.isArray(ws.knowledge)) {
throw new Error('Сервер вернул некорректный список досок.');
}
applyWorkspace(ws);
renderSidebar();

const saved = readActiveSection();
let target = null;

if (saved) {
const item = findWorkspaceItem(saved.type, saved.id);
if (item && (showArchived || !item.archived)) target = saved;
}

if (!target) {
const board = firstActiveBoard();
if (board) target = { type: 'board', id: board.id };
}

if (!target) {
const knowledge = firstActiveKnowledge();
if (knowledge) target = { type: 'knowledge', id: knowledge.id };
}

if (target) activateSection(target.type, target.id);
else {
setSync('Нет доступных досок', 'error');
$('boardView').hidden = false;
$('knowledgeView').hidden = true;
$('board').innerHTML = '<div class="loading">Нет досок и баз знаний. Создай доску кнопкой «＋» в боковой панели.</div>';
}
} catch (error) {
// Список не получен: показываем ошибку и повтор, а не подменяем его листом по умолчанию.
workspaceState = 'error';
workspaceError = errText(error);
renderSidebar();
handleError(error);
$('board').innerHTML = `<div class="loading">Не удалось загрузить список досок: ${esc(workspaceError)} <button class="btn small" type="button" data-side-retry>Повторить</button></div>`;
}
}

/* ---------- Новый статус = новый столбец канбана ---------- */
// Статус записывается на сервере в список допустимых значений столбца «Статус» в самой таблице.
// Интерфейс обновляется только после успешного ответа: «ложных» столбцов не остаётся.
let addingStatus = false;
async function addStatusColumn() {
  if (activeSection.type !== 'board' || sheetId === null || addingStatus) return;
  const name = await askName('Новый статус (столбец канбана)', '', 'Добавить', 120);
  if (!name) return;
  const low = s => String(s).trim().replace(/\s+/g, ' ').toLocaleLowerCase('ru');
  if (allStatuses().some(s => low(s) === low(name))) {
    showNotice('Статус «' + name + '» уже есть. Выбери другое название.', true);
    return;
  }
  addingStatus = true;
  beginWrite();
  try {
    await gs('createStatus', sheetId, name);
    endWrite();
  } catch (error) {
    endWrite(true);
    addingStatus = false;
    showNotice(errText(error), true);
    return;
  }
  addingStatus = false;
  await reloadBoard();
  showNotice('Статус «' + name + '» добавлен: появился столбец канбана');
}

/* ---------- Свойства: показ, порядок, названия, значения, новые столбцы ---------- */
// Те же типы, что принимает сервер (PROP_TYPES в Code.gs). «Длинный текст» — только у встроенного поля «Коммент».
const PROP_TYPE_OPTIONS = [['text', 'Текст'], ['url', 'Ссылка'], ['select', 'Список'], ['date', 'Дата']];

// Перечитывает доску после записи в настройки или в структуру таблицы.
async function reloadBoard() {
  lastSignature = '';
  for (let i = 0; i < 8; i++) {
    if (!loading && pending === 0 && !editor.inFlight) { await loadBoard(true); return; }
    await new Promise(resolve => setTimeout(resolve, 300));
  }
}

// Окно «Свойства». Порядок, показ, названия, типы и значения списков применяются
// кнопкой «Сохранить»; новый столбец создаётся сразу, потому что это запись в таблицу.
// Заголовки существующих столбцов не меняются, столбцы не удаляются.
function openPropertySettings() {
  closeMenu();

  const listable = () => schema.filter(p => !SPECIAL_KEYS.includes(p.key) && p.type !== 'id');
  const find = key => schema.find(p => p.key === key);
  const st = {
    items: {}, order: [], open: '', palette: '', newValue: {},
    adding: false, newTitle: '', newType: 'text', newOptions: ''
  };

  const sync = () => {
    listable().forEach(p => {
      if (!st.items[p.key]) {
        st.items[p.key] = {
          title: p.title,
          hidden: !!p.hidden,
          type: p.type,
          options: [...((propConfig.options || {})[p.key] || [])]
        };
      }
      if (!st.order.includes(p.key)) st.order.push(p.key);
    });
    st.order = st.order.filter(k => find(k) && st.items[k]);
  };
  sync();

  const valuesOf = (p, it) => {
    const base = p.key === 'статус' ? statuses : (dropdownOptions[p.key] || []);
    return [...new Set([...base, ...it.options])];
  };

  const typeOf = (p, it) => p.builtin ? p.type : it.type;

  const valuesHtml = (p, it) => {
    const rows = valuesOf(p, it).map(v => {
      const extra = it.options.includes(v);
      const palette = st.palette === v;

      return `
        <div class="pm-value">
          <span class="value-pill ${pillClass(p.key, v)}">${esc(v)}</span>
          <button type="button" class="color-dot${palette ? ' open' : ''}" data-palette="${esc(v)}" title="Цвет значения" aria-label="Цвет значения: ${esc(v)}">●</button>
          ${extra ? `<button type="button" class="mini" data-act="rmvalue" data-value="${esc(v)}" title="Убрать добавленное значение" aria-label="Убрать значение ${esc(v)}">✕</button>` : ''}
        </div>
        ${palette ? `<div class="swatch-row" data-swatches="${esc(v)}">${swatchesHtml(p.key, v)}</div>` : ''}`;
    }).join('');

    return `
      <div class="pm-values">
        ${rows || '<div class="hint">Значений пока нет.</div>'}
        <div class="pm-add">
          <input class="field small" data-newvalue="${esc(p.key)}" maxlength="120" autocomplete="off"
                 placeholder="Новое значение" value="${esc(st.newValue[p.key] || '')}">
          <button type="button" class="btn small" data-act="addvalue">Добавить</button>
        </div>
      </div>`;
  };

  const rowHtml = (key, i) => {
    const p = find(key);
    const it = st.items[key];
    const type = typeOf(p, it);
    const isSelect = type === 'select';

    return `
      <div class="pm-row" data-key="${esc(key)}">
        <div class="pm-main">
          <span class="grip" draggable="true" data-grip title="Перетащи, чтобы изменить порядок" aria-hidden="true">⠿</span>
          <button type="button" class="mini text pm-vis${it.hidden ? '' : ' on'}" data-act="toggle" aria-pressed="${!it.hidden}"
                  title="Показывать ли свойство в карточке задачи">${it.hidden ? 'Скрыто' : 'В карточке'}</button>
          <input class="field small pm-title" data-title maxlength="60" autocomplete="off"
                 value="${esc(it.title)}" placeholder="${esc(p.sourceTitle || p.title)}" aria-label="Название свойства">
          ${p.builtin
            ? `<span class="pm-type" title="Тип встроенного свойства менять нельзя">${esc(TYPE_LABELS[p.type] || 'Текст')}</span>`
            : `<select class="field small pm-type-sel" data-type aria-label="Тип свойства">${PROP_TYPE_OPTIONS.map(([v, l]) =>
                `<option value="${v}"${it.type === v ? ' selected' : ''}>${l}</option>`).join('')}</select>`}
          ${isSelect ? `<button type="button" class="mini text" data-act="values">${st.open === key ? 'Скрыть значения' : 'Значения и цвета'}</button>` : ''}
          ${!p.builtin && p.mismatch ? `<button type="button" class="mini text warn" data-act="fixtype" title="В таблице у этого столбца остались настройки прежнего типа (список, проверка ссылки, формат даты). Нажми, чтобы привести столбец к выбранному типу: значения останутся.">Исправить в таблице</button>` : ''}
          ${!p.builtin && !p.mismatch && it.type !== p.type ? `<span class="pm-note" title="Столбец в таблице изменится после «Сохранить»">изменится в таблице</span>` : ''}
          <button type="button" class="mini" data-act="up" aria-label="Выше"${i === 0 ? ' disabled' : ''}>↑</button>
          <button type="button" class="mini" data-act="down" aria-label="Ниже"${i === st.order.length - 1 ? ' disabled' : ''}>↓</button>
        </div>
        ${isSelect && st.open === key ? valuesHtml(p, it) : ''}
      </div>`;
  };

  const addHtml = () => st.adding ? `
    <div class="pm-new">
      <div class="pm-new-row">
        <input class="field small" id="pmNewTitle" maxlength="60" autocomplete="off" placeholder="Название свойства" value="${esc(st.newTitle)}">
        <select class="field small" id="pmNewType" aria-label="Тип свойства">${PROP_TYPE_OPTIONS.map(([v, l]) =>
          `<option value="${v}"${st.newType === v ? ' selected' : ''}>${l}</option>`).join('')}</select>
      </div>
      ${st.newType === 'select'
        ? `<textarea class="field small" id="pmNewOptions" rows="3" placeholder="Значения списка — по одному в строке">${esc(st.newOptions)}</textarea>`
        : ''}
      <div class="pm-new-actions">
        <button type="button" class="btn small primary" data-act="create">Создать столбец</button>
        <button type="button" class="btn small" data-act="cancel-add">Отмена</button>
      </div>
      <p class="m-hint">В таблицу добавится новый столбец справа. Существующие столбцы и данные не меняются.</p>
    </div>`
    : '<button type="button" class="btn small" data-act="add">＋ Новое свойство</button>';

  const m = showModal({
    title: 'Свойства',
    width: 720,
    body: '',
    actions: [
      { label: 'Отмена', value: false },
      {
        label: 'Сохранить', kind: 'primary', value: true,
        onClick: async () => {
          // Порядок занимает те же «места», что и в текущей схеме.
          const keys = schema.map(p => p.key);
          const order = keys.slice();
          keys.map((k, i) => (st.order.includes(k) ? i : -1)).filter(i => i >= 0)
            .forEach((slot, i) => { order[slot] = st.order[i]; });

          const cfg = { order, hidden: [], titles: {}, types: {}, options: {} };
          const seen = {};

          schema.forEach(p => {
            const it = st.items[p.key];
            const source = p.sourceTitle || p.title;
            const title = it ? (it.title.trim().replace(/\s+/g, ' ') || source) : p.title;
            const norm = title.toLocaleLowerCase('ru');

            if (seen[norm]) throw new Error('Названия свойств должны быть разными: «' + title + '».');
            seen[norm] = true;

            if (title !== source) cfg.titles[p.key] = title;
            if (it ? it.hidden : p.hidden) cfg.hidden.push(p.key);

            if (it) {
              if (!p.builtin) cfg.types[p.key] = it.type;
              if (typeOf(p, it) === 'select' && it.options.length) cfg.options[p.key] = it.options;
            }
          });

          let savedRes = null;
          beginWrite();
          try {
            savedRes = await gs('savePropertyConfig', sheetId, cfg);
            endWrite();
          } catch (error) {
            endWrite(true);
            throw error;
          }

          // Значения списков, добавленные из интерфейса, переносим в правила самой таблицы:
          // иначе таблица отклонит карточку с таким значением (в том числе со статусом).
          let syncError = '';
          beginWrite();
          try {
            await gs('syncPropertyOptions', sheetId);
            endWrite();
          } catch (error) {
            endWrite(true);
            syncError = errText(error);
          }

          await reloadBoard();
          if (syncError) {
            showNotice('Настройки сохранены, но значения не добавлены в список таблицы: ' + syncError, true);
            return;
          }
          const changed = savedRes && savedRes.converted ? savedRes.converted.length : 0;
          showNotice(changed ? 'Свойства сохранены, столбцов приведено к новому типу: ' + changed : 'Свойства сохранены');
        }
      }
    ]
  });

  const body = m.body;
  let dragKey = '';

  const draw = () => {
    body.innerHTML = `
      <div class="pm-top">${addHtml()}</div>
      <div class="pm-list">${st.order.map(rowHtml).join('') || '<div class="empty">Свойств нет</div>'}</div>
      <p class="m-hint">Скрытое свойство не показывается в карточке задачи, но столбец и данные остаются в таблице, а само свойство доступно в фильтрах и экспорте. Названия меняются только в приложении — заголовки столбцов в таблице остаются прежними. Удалить столбец можно только в самой таблице.</p>`;
  };

  const moveKey = (key, to) => {
    const from = st.order.indexOf(key);
    if (from < 0 || to < 0 || to >= st.order.length) return;
    st.order.splice(from, 1);
    st.order.splice(to, 0, key);
  };

  const addValue = key => {
    const p = find(key);
    const it = st.items[key];
    const input = body.querySelector(`[data-newvalue="${CSS.escape(key)}"]`);
    const value = input ? input.value.trim().replace(/\s+/g, ' ') : '';

    if (!value) return;
    if (valuesOf(p, it).includes(value)) { showNotice('Такое значение уже есть.', true); return; }
    if (it.options.length >= 100) { showNotice('Можно добавить не больше 100 значений.', true); return; }

    it.options.push(value);
    st.newValue[key] = '';
    draw();
  };

  // Приводит столбец в таблице к выбранному типу сразу, без «Сохранить».
  const fixType = async key => {
    const it = st.items[key];
    if (!it) return;

    beginWrite();
    try {
      await gs('changePropertyType', sheetId, key, it.type);
      endWrite();
    } catch (error) {
      endWrite(true);
      showNotice(errText(error), true);
      return;
    }

    await reloadBoard();
    delete st.items[key];
    sync();
    draw();
    showNotice('Столбец приведён к типу «' + (TYPE_LABELS[it.type] || it.type) + '»');
  };

  const createNew = async () => {
    const title = st.newTitle.trim().replace(/\s+/g, ' ');
    const options = st.newType === 'select'
      ? st.newOptions.split('\n').map(v => v.trim()).filter(Boolean)
      : [];

    if (!title) { showNotice('Введи название свойства.', true); return; }

    beginWrite();
    try {
      await gs('createProperty', sheetId, { title, type: st.newType, options });
      endWrite();
    } catch (error) {
      endWrite(true);
      showNotice(errText(error), true);
      return;
    }

    await reloadBoard();
    Object.assign(st, { adding: false, newTitle: '', newType: 'text', newOptions: '', open: '', palette: '' });
    sync();
    draw();
    showNotice('Свойство «' + title + '» добавлено в таблицу');
  };

  body.addEventListener('click', event => {
    const swatch = event.target.closest('[data-set-color]');
    if (swatch) {
      const holder = swatch.closest('[data-swatches]');
      if (holder && st.open) {
        setValueColor(st.open, holder.dataset.swatches, swatch.dataset.setColor);
        draw();
      }
      return;
    }

    const pal = event.target.closest('[data-palette]');
    if (pal) {
      st.palette = st.palette === pal.dataset.palette ? '' : pal.dataset.palette;
      draw();
      return;
    }

    const act = event.target.closest('[data-act]');
    if (!act) return;

    const row = act.closest('.pm-row');
    const key = row ? row.dataset.key : '';

    switch (act.dataset.act) {
      case 'add': st.adding = true; draw(); body.querySelector('#pmNewTitle').focus(); break;
      case 'cancel-add': st.adding = false; draw(); break;
      case 'create': createNew(); break;
      case 'toggle': st.items[key].hidden = !st.items[key].hidden; draw(); break;
      case 'values': st.open = st.open === key ? '' : key; st.palette = ''; draw(); break;
      case 'up': moveKey(key, st.order.indexOf(key) - 1); draw(); break;
      case 'down': moveKey(key, st.order.indexOf(key) + 1); draw(); break;
      case 'addvalue': addValue(key); break;
      case 'fixtype': fixType(key); break;
      case 'rmvalue':
        st.items[key].options = st.items[key].options.filter(v => v !== act.dataset.value);
        draw();
        break;
    }
  });

  // Ввод не перерисовывает окно, чтобы не терять курсор.
  body.addEventListener('input', event => {
    const t = event.target;
    const row = t.closest('.pm-row');

    if (t.matches('[data-title]') && row) st.items[row.dataset.key].title = t.value;
    else if (t.matches('[data-newvalue]')) st.newValue[t.dataset.newvalue] = t.value;
    else if (t.id === 'pmNewTitle') st.newTitle = t.value;
    else if (t.id === 'pmNewOptions') st.newOptions = t.value;
  });

  body.addEventListener('change', event => {
    const t = event.target;
    const row = t.closest('.pm-row');

    if (t.matches('[data-type]') && row) {
      st.items[row.dataset.key].type = t.value;
      if (t.value !== 'select' && st.open === row.dataset.key) st.open = '';
      draw();
    } else if (t.id === 'pmNewType') {
      st.newType = t.value;
      draw();
    }
  });

  body.addEventListener('keydown', event => {
    if (event.key !== 'Enter') return;

    if (event.target.matches('[data-newvalue]')) {
      event.preventDefault();
      addValue(event.target.dataset.newvalue);
    } else if (event.target.id === 'pmNewTitle') {
      event.preventDefault();
      createNew();
    }
  });

  // Порядок можно менять перетаскиванием за «ручку».
  body.addEventListener('dragstart', event => {
    const grip = event.target.closest('[data-grip]');
    if (!grip) return;
    dragKey = grip.closest('.pm-row').dataset.key;
    event.dataTransfer.effectAllowed = 'move';
    event.dataTransfer.setData('text/plain', 'property');
  });

  body.addEventListener('dragover', event => {
    const row = event.target.closest('.pm-row');
    if (!row || !dragKey) return;
    event.preventDefault();
    body.querySelectorAll('.drop-target').forEach(el => el.classList.remove('drop-target'));
    row.classList.add('drop-target');
  });

  body.addEventListener('drop', event => {
    const row = event.target.closest('.pm-row');
    if (!row || !dragKey) return;
    event.preventDefault();
    moveKey(dragKey, st.order.indexOf(row.dataset.key));
    dragKey = '';
    draw();
  });

  body.addEventListener('dragend', () => {
    dragKey = '';
    body.querySelectorAll('.drop-target').forEach(el => el.classList.remove('drop-target'));
  });

  draw();
}

/* ---------- Редактор фильтров (панель над доской и экспорт) ---------- */
function optionsFor(p) {
const base = p.key === 'статус' ? statuses : (p.type === 'select' ? (dropdownOptions[p.key] || []) : []);
const used = tasks.map(t => String(t[p.key] || '').trim()).filter(Boolean);
const all = [...new Set([...base, ...used])];
return p.key === 'статус' ? all : all.sort((a, b) => a.localeCompare(b, 'ru', { numeric: true }));
}
function groupCount(f, key) {
if (f.values[key] && f.values[key].length) return f.values[key].length;
if (f.text[key] && String(f.text[key]).trim()) return 1;
const d = f.dates[key];
return d && (d.from || d.to) ? 1 : 0;
}
function filtersPanelHtml(f) {
const groups = schema
.filter(p => !['id', 'title'].includes(p.type))
.map(p => {
const count = groupCount(f, p.key);
const head = `<summary><span class="fp-name">${esc(p.title)}</span><span class="fp-count"${count ? '' : ' hidden'}>${count}</span></summary>`;
const open = count ? ' open' : '';
if (p.type === 'select' || p.key === 'версия') {
const selected = f.values[p.key] || [];
const options = [...optionsFor(p), EMPTY_TOKEN];
return `<details class="fp-group" data-key="${esc(p.key)}"${open}>${head}
<div class="fp-options">${options.map(value => `
<label class="fp-option">
<input type="checkbox" value="${esc(value)}"${selected.includes(value) ? ' checked' : ''}>
${value === EMPTY_TOKEN
? '<span class="fp-empty">Не заполнено</span>'
: (p.type === 'select'
? `<span class="value-pill ${pillClass(p.key, value)}">${esc(value)}</span>`
: `<span>${esc(value)}</span>`)}
</label>`).join('')}
</div></details>`;
}
if (p.type === 'date') {
const range = f.dates[p.key] || {};
return `<details class="fp-group" data-key="${esc(p.key)}"${open}>${head}
<div class="fp-dates">
<label>С <input type="date" class="field small" data-date="from" value="${esc(range.from || '')}"></label>
<label>По <input type="date" class="field small" data-date="to" value="${esc(range.to || '')}"></label>
</div></details>`;
}
return `<details class="fp-group" data-key="${esc(p.key)}"${open}>${head}
<div class="fp-text">
<input class="field small" data-text placeholder="Содержит…" value="${esc(f.text[p.key] || '')}">
</div></details>`;
}).join('');
return `
<div class="fp-head">
<span>Условия</span>
<button type="button" class="fp-reset" data-fp-reset>Сбросить все</button>
</div>
<div class="fp-body">${groups || '<div class="empty">Нет свойств для фильтрации</div>'}</div>
`;
}
// Рисует редактор условий внутри root и держит его в связи с объектом фильтров.
// getF — функция, возвращающая актуальный объект { search, values, text, dates }.
// Возвращает функцию полной перерисовки.
function mountFilterEditor(root, getF, onChange) {
const render = () => { root.innerHTML = filtersPanelHtml(getF()); };
render();
const touched = group => {
const count = groupCount(getF(), group.dataset.key);
const badge = group.querySelector('.fp-count');
badge.textContent = count;
badge.hidden = !count;
onChange();
};
root.addEventListener('change', event => {
const group = event.target.closest('.fp-group');
if (!group) return;
const key = group.dataset.key;
const f = getF();
if (event.target.matches('input[type="checkbox"]')) {
const checked = [...group.querySelectorAll('input[type="checkbox"]:checked')].map(i => i.value);
if (checked.length) f.values[key] = checked;
else delete f.values[key];
} else if (event.target.matches('[data-date]')) {
const from = group.querySelector('[data-date="from"]').value;
const to = group.querySelector('[data-date="to"]').value;
if (from || to) f.dates[key] = { from, to };
else delete f.dates[key];
} else {
return;
}
touched(group);
});
root.addEventListener('input', event => {
if (!event.target.matches('[data-text]')) return;
const group = event.target.closest('.fp-group');
const key = group.dataset.key;
const text = event.target.value;
const f = getF();
if (text.trim()) f.text[key] = text;
else delete f.text[key];
touched(group);
});
root.addEventListener('click', event => {
if (!event.target.closest('[data-fp-reset]')) return;
const f = getF();
f.values = {};
f.text = {};
f.dates = {};
render();
onChange();
});
return render;
}
function openFiltersPanel() {
if (openMenu && openMenu.key === '__filters') {
closeMenu();
return;
}
closeMenu();
const trigger = $('filtersBtn');
const menu = document.createElement('div');
menu.className = 'filter-pop';
menu.setAttribute('role', 'dialog');
menu.setAttribute('aria-label', 'Фильтры');
mountFilterEditor(menu, () => draft.filters, () => {
syncQuickSelects();
refreshView();
});
document.body.appendChild(menu);
placeFloating(menu, trigger);
openMenu = { key: '__filters', menu, trigger };
}

/* ---------- Окно «Настроить вид»: столбцы и поля карточки ---------- */
function openViewSettings(startTab = 'active') {
const view = currentView();
const lanes = laneOrder(view);
const st = {
tab: startTab,
active: [...lanes.active],
hidden: [...lanes.hidden],
show: new Set(cardProps(view))
};
const countOf = status =>
tasks.filter(t => (String(t['статус'] || '').trim() || NO_STATUS) === status).length;
const cardable = schema.filter(p => !['задача', 'номер'].includes(p.key));
const m = showModal({
title: 'Настроить вид · ' + view.name,
width: 560,
body: '',
actions: [
{ label: 'Отмена', value: false },
{
label: 'Сохранить', kind: 'primary', value: true,
onClick: async () => {
const next = clone(currentView());
next.columns = { order: [...st.active, ...st.hidden], hidden: [...st.hidden] };

});
const body = m.body;
let dragFrom = -1;
const draw = () => {
const tabs = [
['active', 'Активные', st.active.length],
['hidden', 'Скрытые', st.hidden.length],
['fields', 'Поля карточки', null]
];
let content = '';
if (st.tab === 'active') {
content = st.active.length
? st.active.map((status, i) => `
<div class="col-row" draggable="true" data-index="${i}">

<button type="button" class="mini text" data-act="hide">Скрыть</button>
</div>`).join('')
: '<div class="empty">Все столбцы скрыты — на доске ничего не будет видно.</div>';
content += '<p class="m-hint">Порядок меняется перетаскиванием или кнопками ↑ ↓. Скрытие столбца — только настройка отображения: задачи в таблице не меняются.</p>';
} else if (st.tab === 'hidden') {
content = st.hidden.length
? st.hidden.map((status, i) => `
<div class="col-row" data-index="${i}">
<span class="col-dot" style="background:${laneColor(status, i)}"></span>
<span class="col-name">${esc(status)}</span>
<span class="col-count" title="Задач в столбце">${countOf(status)}</span>
<button type="button" class="mini text" data-act="show">Показать</button>
</div>`).join('')
: '<div class="empty">Скрытых столбцов нет.</div>';
} else {
content = cardable.map(p => `
<label class="field-row">
<input type="checkbox" data-field="${esc(p.key)}"${st.show.has(p.key) ? ' checked' : ''}>
<span class="field-name">${esc(p.title)}</span>
<span class="field-type">${esc(TYPE_LABELS[p.type] || 'Текст')}</span>
</label>`).join('') +
'<div class="m-actions"><button type="button" class="btn small" data-act="defaults">По умолчанию</button></div>' +
'<p class="m-hint">Эти свойства показываются на карточках доски в этом представлении. В самой карточке задачи доступны все свойства.</p>';
}
body.innerHTML = `
<div class="m-tabs" role="tablist">
${tabs.map(([id, label, n]) => `
<button type="button" class="m-tab${st.tab === id ? ' active' : ''}" role="tab" aria-selected="${st.tab === id}" data-tab="${id}">${label}${n === null ? '' : ` <span class="m-count">${n}</span>`}</button>
`).join('')}
</div>
<div class="m-list">${content}</div>
`;
};
const move = (list, from, to) => {
if (to < 0 || to >= list.length) return;
const [item] = list.splice(from, 1);
list.splice(to, 0, item);
};
body.addEventListener('click', event => {
const tab = event.target.closest('[data-tab]');
if (tab) { st.tab = tab.dataset.tab; draw(); return; }
const act = event.target.closest('[data-act]');
if (!act) return;
const row = act.closest('.col-row');
const i = row ? Number(row.dataset.index) : -1;
if (act.dataset.act === 'up') move(st.active, i, i - 1);
else if (act.dataset.act === 'down') move(st.active, i, i + 1);
else if (act.dataset.act === 'hide') st.hidden.push(st.active.splice(i, 1)[0]);
else if (act.dataset.act === 'show') st.active.push(st.hidden.splice(i, 1)[0]);
else if (act.dataset.act === 'defaults') st.show = new Set(defaultCardProps());
draw();
});
body.addEventListener('change', event => {
const box = event.target.closest('[data-field]');
if (!box) return;
if (box.checked) st.show.add(box.dataset.field);
else st.show.delete(box.dataset.field);
});
// Перетаскивание порядка активных столбцов.
body.addEventListener('dragstart', event => {
const row = event.target.closest('.col-row[draggable]');

dragFrom = Number(row.dataset.index);
event.dataTransfer.effectAllowed = 'move';
event.dataTransfer.setData('text/plain', 'column');
row.classList.add('dragging');
});
body.addEventListener('dragover', event => {
const row = event.target.closest('.col-row[draggable]');
if (!row || dragFrom < 0) return;
event.preventDefault();
body.querySelectorAll('.drop-target').forEach(el => el.classList.remove('drop-target'));
row.classList.add('drop-target');
});
body.addEventListener('drop', event => {
const row = event.target.closest('.col-row[draggable]');
if (!row || dragFrom < 0) return;
event.preventDefault();
move(st.active, dragFrom, Number(row.dataset.index));
dragFrom = -1;
draw();
});
body.addEventListener('dragend', () => {
dragFrom = -1;
body.querySelectorAll('.dragging,.drop-target').forEach(el => el.classList.remove('dragging', 'drop-target'));
});
draw();
}

/* ---------- Доска ---------- */
/* ---------- Личный вид доски: свёрнутые столбцы и компактные карточки ---------- */
// Хранится в браузере отдельно для каждой доски и не меняет общие представления команды.
function readBoardUi() {
try {
const raw = JSON.parse(localStorage.getItem(BOARD_UI_KEY) || '{}');
return raw && typeof raw === 'object' && !Array.isArray(raw) ? raw : {};
} catch (e) {
return {};
}
}
function boardUiFor() {
const key = String(sheetId ?? '');
if (!boardUi[key] || typeof boardUi[key] !== 'object') boardUi[key] = { collapsed: [], compact: false };
if (!Array.isArray(boardUi[key].collapsed)) boardUi[key].collapsed = [];
return boardUi[key];
}
function saveBoardUi() {
try {
// Перед записью перечитываем: в другой вкладке могли поменять другую доску.
const key = String(sheetId ?? '');
const all = readBoardUi();
all[key] = boardUiFor();
boardUi = all;
localStorage.setItem(BOARD_UI_KEY, JSON.stringify(all));
} catch (e) { /* не критично: настройка останется до перезагрузки */ }
}
const isCompact = () => !!boardUiFor().compact;
const isLaneCollapsed = status => boardUiFor().collapsed.includes(status);
function toggleLane(status) {
const ui = boardUiFor();
const index = ui.collapsed.indexOf(status);
if (index === -1) ui.collapsed.push(status);
else ui.collapsed.splice(index, 1);
ui.collapsed = ui.collapsed.slice(-100);
saveBoardUi();
renderBoard();
}
function setCompact(on) {
boardUiFor().compact = !!on;
saveBoardUi();
renderBoard();
}
function syncCompactBtn() {
const button = $('compactBtn');
if (!button) return;
const on = isCompact();
button.classList.toggle('is-on', on);
button.setAttribute('aria-pressed', String(on));
}
// Компактная карточка: только заголовок. Номер и полное название — во всплывающей подсказке.
function compactCard(task) {
const number = task['номер'] || '#' + task._row;
return `<article class="task compact" draggable="true" data-id="${esc(task._id)}" title="№ ${esc(number)} · ${esc(task['задача'])}"><div class="task-title">${esc(task['задача'])}</div></article>`;
}
function renderBoard() {
const view = currentView();
syncCompactBtn();
const lanes = laneOrder(view);
const known = allStatuses();
const visible = getFilteredTasks();
// Скрытые столбцы только не показываются: задачи в таблице остаются как есть.
const grouped = new Map(lanes.active.map(status => [status, []]));
let inHidden = 0;
visible.forEach(task => {
const status = String(task['статус'] || '').trim() || NO_STATUS;
if (grouped.has(status)) grouped.get(status).push(task);
else inHidden++;
});
grouped.forEach((items, status) => grouped.set(status, sortTasks(items)));
$('stats').innerHTML = `
<div class="stat">Всего задач <strong>${tasks.length}</strong></div>
<div class="stat">По фильтрам <strong>${visible.length}</strong></div>
<div class="stat">Столбцов <strong>${lanes.active.length}/${lanes.order.length}</strong></div>
${inHidden ? `<div class="stat">В скрытых столбцах <strong>${inHidden}</strong></div>` : ''}
`;
$('board').innerHTML = ([...grouped.entries()].map(([status, items]) => {
// Цвет точки привязан к статусу (а не к позиции после перестановки).
const assigned = colorOf('статус', status);
const color = assigned ? COLOR_HEX[assigned] : COLORS[Math.max(0, known.indexOf(status)) % COLORS.length];
// Свёрнутый столбец: только заголовок, число карточек, кнопка добавления и разворачивание.
// Сам столбец остаётся на доске, поэтому карточку можно перетащить на него.
if (isLaneCollapsed(status)) {
return `
<section class="lane collapsed" data-status="${esc(status)}" style="--lane-color:${color}">
<div class="lane-head">
<button class="lane-toggle" type="button" data-toggle-lane="${esc(status)}" aria-expanded="false" title="Развернуть столбец" aria-label="Развернуть столбец «${esc(status)}»">▸</button>
<div class="lane-title"><span class="dot"></span><span>${esc(status)}</span></div>
<span class="count" title="Карточек: ${items.length}">${items.length}</span>
<button class="add-lane" type="button" data-add-status="${esc(status)}" title="Создать задачу в этом статусе" aria-label="Создать задачу в статусе «${esc(status)}»">+</button>
</div>
</section>
`;
}
const cards = items.length
? items.map(t => taskCard(t, view)).join('')
: '<div class="empty">Перетащи сюда задачу</div>';
return `
<section class="lane" data-status="${esc(status)}" style="--lane-color:${color}">
<div class="lane-head">
<button class="lane-toggle" type="button" data-toggle-lane="${esc(status)}" aria-expanded="true" title="Свернуть столбец" aria-label="Свернуть столбец «${esc(status)}»">▾</button>
<div class="lane-title"><span class="dot"></span><span>${esc(status)}</span></div>
<span class="count">${items.length}</span>
<button class="add-lane" type="button" data-add-status="${esc(status)}" title="Создать задачу в этом статусе">+</button>
</div>
<div class="lane-cards">${cards}</div>
</section>
`;
}).join('') || '<div class="board-note">Все столбцы скрыты. Открой «▥ Настроить вид», чтобы вернуть нужные.</div>') +
'<div class="lane-add-col" style="flex:0 0 auto;align-self:flex-start;padding:4px 8px"><button class="btn" type="button" data-add-column title="Создать новый статус и столбец канбана">＋ Добавить столбец</button></div>';
document.querySelectorAll('.lane').forEach(lane => {
lane.addEventListener('dragover', event => {
event.preventDefault();
lane.classList.add('drag-over');
});
lane.addEventListener('dragleave', event => {
if (!lane.contains(event.relatedTarget)) lane.classList.remove('drag-over');
});
lane.addEventListener('drop', event => {
event.preventDefault();
lane.classList.remove('drag-over');
const id = event.dataTransfer.getData('text/plain');
const task = tasks.find(t => t._id === id);
const laneStatus = lane.dataset.status;
const newStatus = laneStatus === NO_STATUS ? '' : laneStatus;
if (task && String(task['статус'] || '') !== newStatus) changeStatus(task, newStatus);
});
});
document.querySelectorAll('[data-add-status]').forEach(button => {
button.addEventListener('click', () => {
const status = button.dataset.addStatus;
openEditor(null, status === NO_STATUS ? '' : status);
});
});
document.querySelectorAll('.task').forEach(card => {
card.addEventListener('dragstart', event => {
card.classList.add('dragging');
event.dataTransfer.setData('text/plain', card.dataset.id);
event.dataTransfer.effectAllowed = 'move';
});
card.addEventListener('dragend', () => card.classList.remove('dragging'));
card.addEventListener('click', event => {
if (event.target.closest('a[data-link]')) return;
const task = tasks.find(t => t._id === card.dataset.id);
if (task) openEditor(task);
});
});
}
// Пилюли свойств на карточке: только те, что включены в представлении.
function cardTags(task, view) {
const show = cardProps(view);
const skip = ['задача', 'номер', 'коммент', ...CARD_BOTTOM];
return schema
.filter(p => show.has(p.key) && !skip.includes(p.key) && p.type !== 'longtext')
.map(p => {
const value = String(task[p.key] || '').trim();
if (!value) return '';
if (p.type === 'date') return pillTag(p.key, value, fmtDate(value), p.title);
if (p.type === 'url') {
const href = safeHref(value);
if (href) return linkTag(p.key, value, href, p.title);
}
// У пользовательских текстовых свойств показываем название: по одному значению не понять, что это.
const text = !p.builtin && p.type === 'text' ? p.title + ': ' + value : value;
return pillTag(p.key, value, text, p.title);
})
.join('');
}
function taskCard(task, view) {
if (isCompact()) return compactCard(task);
const show = cardProps(view);
const tags = cardTags(task, view);
const comment = show.has('коммент') ? richToHtml(task['коммент']) : '';
const showAssignee = show.has('исполнитель');
const showDeveloper = show.has('разраб');
const bottom = showAssignee || showDeveloper ? `
<div class="task-bottom">
<span>${showAssignee ? (task['исполнитель'] ? '◉ ' + esc(task['исполнитель']) : 'Без исполнителя') : ''}</span>
<span>${showDeveloper && task['разраб'] ? '⚙ ' + esc(task['разраб']) : ''}</span>
</div>` : '';
return `
<article class="task" draggable="true" data-id="${esc(task._id)}">
<div class="task-top">
<span class="task-id">${esc(task['номер'] || '#' + task._row)}</span>
<span style="color:#898da7">↗</span>
</div>
<div class="task-title">${esc(task['задача'])}</div>
${tags ? `<div class="task-meta">${tags}</div>` : ''}
${comment ? `<div class="task-comment">${comment}</div>` : ''}
${bottom}
</article>
`;
}
// Ссылка на карточке: настоящая ссылка, открывается в новой вкладке и не открывает карточку.

/* ---------- Запись в таблицу ---------- */
// Записи одной задачи идут строго по очереди: старый запрос
// не может завершиться позже нового и затереть его результат.
function sendPatch(task, changes) {
const run = () => {
const base = {};
Object.keys(changes).forEach(k => { base[k] = task._base[k] ?? ''; });
beginWrite();
return gs('saveTask', sheetId, task._id, changes, base).then(
res => {
endWrite();
const conflicts = res.conflicts || {};
const values = res.values || {};
Object.keys(changes).forEach(k => {
if (k in conflicts) {
task[k] = conflicts[k];
task._base[k] = conflicts[k];
} else if (k in values) {
task[k] = values[k];
task._base[k] = values[k];
}
});
return { conflicts };
},
error => {
endWrite(true);
throw error;
}
);
};
const chain = (task._chain || Promise.resolve()).catch(() => {}).then(run);
task._chain = chain;
return chain;
}

.then(({ conflicts }) => {

} else {
showNotice('Статус изменён: ' + (newStatus || NO_STATUS));

renderBoard();
})
.catch(error => {
task['статус'] = task._base['статус'];
renderBoard();
showNotice(errText(error), true);
});
}

const taskNormLinkText = s => String(s ?? '').replace(/\s+/g, ' ').trim();

const URL_TAIL_RE = /(?:https?:\/\/|www\.)[^\s<>"'`]+$/i;
const BARE_DOMAIN_RE = /(?:^|[\s([{"'])([a-z0-9](?:[a-z0-9-]*[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]*[a-z0-9])?)+)([\/?#][^\s<>"'`]*)?$/i;

function taskSelectionRange() {

function applyTaskLink(anchor, range, label, url) {

    const after = document.createRange();
    after.setStartAfter(anchor);
    after.collapse(true);

    const s = window.getSelection();
    s.removeAllRanges();
    s.addRange(after);
    return;
  }
  const r = restoreTaskRange(range);
  const sel = window.getSelection();
  const collapsed = !r || r.collapsed;
  const keepFormat = !collapsed && taskNormLinkText(r.toString()) === label;
  let done = false;

          '<a href="' + escAttr(url) + '">' + escText(label) + '</a>' + (collapsed ? '&nbsp;' : ''));

  }
  if (!done && r) {
    const a = document.createElement('a');
    a.setAttribute('href', url);
    a.textContent = label;
    r.deleteContents();
    r.insertNode(a);
    const after = document.createRange();
    after.setStartAfter(a);
    after.collapse(true);
    sel.removeAllRanges();

/** Автоссылка: если перед курсором лежит URL в текстовом узле (не внутри <a>), превращаем его в <a>. */
function autoLinkBeforeCaret() {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount || !sel.isCollapsed) return false;
  const r = sel.getRangeAt(0);
  let node = r.startContainer;
  if (!node || !rich.contains(node)) return false;
  // если уже внутри ссылки — ничего не делаем
  let p = node.nodeType === 3 ? node.parentNode : node;
  while (p && p !== rich) {
    if (p.nodeName === 'A') return false;
    p = p.parentNode;
  }
  if (node.nodeType !== 3) return false;
  const text = node.nodeValue || '';
  const offset = r.startOffset;
  const left = text.slice(0, offset);
  // ищем URL в конце левой части
  let match = URL_TAIL_RE.exec(left);
  let raw = match ? match[0] : '';
  // обрезаем хвостовую пунктуацию
  if (raw) {
    raw = raw.replace(/[.,;:!?)]+$/, '');
  }
  if (!raw) {
    // пробуем голый домен example.com/path
    const m2 = BARE_DOMAIN_RE.exec(left);
    if (m2) {
      raw = (m2[1] + (m2[2] || '')).replace(/[.,;:!?)]+$/, '');
    }
  }
  if (!raw || raw.length < 4) return false;
  const url = linkUrlOrNull(raw);
  if (!url) return false;
  const start = offset - raw.length;
  if (start < 0) return false;
  try {
    const range = document.createRange();
    range.setStart(node, start);
    range.setEnd(node, offset);
    sel.removeAllRanges();
    sel.addRange(range);
    const ok = document.execCommand('createLink', false, url);
    if (ok) {
      sel.collapseToEnd();
      return true;
    }
    // fallback
    const a = document.createElement('a');
    a.setAttribute('href', url);
    a.textContent = raw;
    range.deleteContents();
    range.insertNode(a);
    const after = document.createRange();
    after.setStartAfter(a);
    after.collapse(true);
    sel.removeAllRanges();
    sel.addRange(after);
    return true;
  } catch (e) {
    return false;
  }
}

function bindTaskLinkUi() {
  const form = $('taskLinkForm');
  if (form && form.dataset.bound !== '1') {

      }

/* ---------- Экспорт (этап 4) ---------- */
// Выгрузка целиком строится в браузере из уже загруженных задач и ничего
// не записывает ни в таблицу, ни в свойства скрипта.
// Внешних библиотек нет: XLSX собирается вручную (ZIP без сжатия + XML).
// <export-core>
const Q = String.fromCharCode(63); // '?'
const XML_HEAD = '<' + Q + 'xml version="1.0" encoding="UTF-8" standalone="yes"' + Q + '>';
const XLSX_MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
// Из безопасного HTML описания (теги b, i, u, s, ul, ol, li, div, br) делает обычный текст:
// строки сохраняются, списки превращаются в «• пункт» и «1. пункт».
function htmlToText(html) {
const lines = [];
const stack = [];
let cur = '';
let href = '';
let linkStart = 0;
const flush = () => { lines.push(cur); cur = ''; };
const re = /<(\/?)(ul|ol|li|div|br|b|i|u|s|a)(?:\s[^>]*){0,1}>|([^<]+)/g;
let m;
while ((m = re.exec(html))) {
if (m[3] !== undefined) { cur += m[3]; continue; }
const closing = m[1] === '/';
const tag = m[2];
if (tag === 'br') {
if (!closing) flush();
} else if (tag === 'a') {
if (!closing) {
const hm = /href="([^"]*)"/.exec(m[0]);
href = hm ? hm[1] : '';
linkStart = cur.length;
} else if (href) {
if (cur.slice(linkStart) !== href) cur += ' (' + href + ')';
href = '';
}
} else if (tag === 'div') {
if (cur) flush();
} else if (tag === 'ul' || tag === 'ol') {
if (cur) flush();
if (closing) stack.pop();
else stack.push({ tag, n: 0 });
} else if (tag === 'li') {
if (cur) flush();
if (!closing) {
const top = stack[stack.length - 1];
if (top) top.n++;
cur = '  '.repeat(Math.max(0, stack.length - 1)) + (top && top.tag === 'ol' ? top.n + '. ' : '• ');
}
}
}
if (cur) flush();
return lines.join('\n')
.replace(/&nbsp;/g, ' ')
.replace(/&lt;/g, '<')
.replace(/&gt;/g, '>')
.replace(/&quot;/g, '"')
.replace(/&amp;/g, '&')
.replace(/\n+$/, '');
}
function richToText(value) {
const s = String(value ?? '');
if (!s.trim()) return '';
if (!HAS_TAGS.test(s)) return s.replace(/\r\n?/g, '\n');
return htmlToText(toSafeHtml(s));
}
function excelSerial(iso) {
return Math.round(Date.UTC(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10)) / 86400000) + 25569;
}
// Ячейка выгрузки: k — тип (text | number | date), v — значение для XLSX, s — текст для CSV.
function exportCell(p, task) {
const raw = String(task[p.key] ?? '');
if (p.type === 'longtext') {
const t = richToText(raw);
return { k: 'text', v: t, s: t };
}
// Дата — настоящая дата в XLSX; нераспознанный текст остаётся текстом.
if (p.type === 'date' && isIso(raw)) return { k: 'date', v: excelSerial(raw), s: fmtDate(raw) };
if (p.type === 'id' && /^\d{1,15}$/.test(raw.trim())) {

}

function buildExportTable(list, fields) {

function toCsv(table, delimiter) {
const q = value => {
const s = String(value);
return s.includes('"') || s.includes(delimiter) || /[\r\n]/.test(s)
? '"' + s.replace(/"/g, '""') + '"'
: s;

const lines = [table.headers.map(q).join(delimiter)];
table.rows.forEach(row => lines.push(row.map(c => q(c.s)).join(delimiter)));

// Недопустимые в XML и в именах файлов управляющие символы собираем из кодов,

function xmlEsc(s) {
return String(s)
.replace(XML_BAD_CHARS, '')
.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

function colName(index) {
let s = '';
for (let n = index + 1; n > 0; n = Math.floor((n - 1) / 26)) {
s = String.fromCharCode(65 + (n - 1) % 26) + s;

}
const CRC_TABLE = (() => {
const t = new Uint32Array(256);
for (let n = 0; n < 256; n++) {
let c = n;
for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;

function crc32(bytes) {

// ZIP без сжатия (метод «store»): для XLSX этого достаточно.
function zipStore(files, mime) {

const data = enc.encode(f.text);
const crc = crc32(data);

local.setUint32(0, 0x04034b50, true);
local.setUint16(4, 20, true);
local.setUint16(6, 0x0800, true);
local.setUint16(8, 0, true);
local.setUint16(10, dosTime, true);
local.setUint16(12, dosDate, true);
local.setUint32(14, crc, true);
local.setUint32(18, data.length, true);
local.setUint32(22, data.length, true);
local.setUint16(26, name.length, true);
local.setUint16(28, 0, true);

cen.setUint32(0, 0x02014b50, true);
cen.setUint16(4, 20, true);
cen.setUint16(6, 20, true);
cen.setUint16(8, 0x0800, true);
cen.setUint16(10, 0, true);
cen.setUint16(12, dosTime, true);
cen.setUint16(14, dosDate, true);
cen.setUint32(16, crc, true);
cen.setUint32(20, data.length, true);
cen.setUint32(24, data.length, true);
cen.setUint16(28, name.length, true);
cen.setUint16(30, 0, true);
cen.setUint16(32, 0, true);
cen.setUint16(34, 0, true);
cen.setUint16(36, 0, true);
cen.setUint32(38, 0, true);
cen.setUint32(42, offset, true);
central.push(new Uint8Array(cen.buffer), name);
offset += 30 + name.length + data.length;

const centralSize = central.reduce((sum, c) => sum + c.length, 0);

end.setUint32(0, 0x06054b50, true);
end.setUint16(4, 0, true);
end.setUint16(6, 0, true);
end.setUint16(8, files.length, true);
end.setUint16(10, files.length, true);
end.setUint32(12, centralSize, true);
end.setUint32(16, offset, true);
end.setUint16(20, 0, true);

// Возвращает выделение в статью. Если сохранённое место пропало (текст перерисовался), ставит курсор в конец.
function restoreKnRange(range) {

if (!el) return null;
el.focus();
let r = range;
if (!r || !el.contains(r.commonAncestorContainer)) {
r = document.createRange();
