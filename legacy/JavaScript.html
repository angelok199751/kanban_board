function applyKnLink(anchor, range, label, url) {
const el = knEditor.contentEl;
if (anchor && el.contains(anchor)) {
anchor.setAttribute('href', url);
if (anchor.textContent !== label) anchor.textContent = label;
const after = document.createRange();
after.setStartAfter(anchor);
after.collapse(true);
el.focus();
const s = window.getSelection();
s.removeAllRanges();
s.addRange(after);
return;
}
const r = restoreKnRange(range);
const sel = window.getSelection();
const collapsed = !r || r.collapsed;
const keepFormat = !collapsed && normLinkText(r.toString()) === label;
let done = false;
try {
// Выделенный текст без изменений: ссылка оборачивает его, не теряя форматирования внутри.
// Иначе вставляется новый текст ссылки; для пустого выделения добавляется пробел,
// чтобы текст, набираемый дальше, не продолжал ссылку.
done = keepFormat
? document.execCommand('createLink', false, url)
: document.execCommand('insertHTML', false,
'<a href="' + escAttr(url) + '">' + escText(label) + '</a>' + (collapsed ? '&nbsp;' : ''));
} catch (e) {
done = false;
}
if (!done && r) {
const a = document.createElement('a');
a.setAttribute('href', url);
a.textContent = label;
r.deleteContents();
r.insertNode(a);
const after = document.createRange();
after.setStartAfter(a);
after.collapse(true);
sel.removeAllRanges();
sel.addRange(after);

function normalizeHex(value, fallback) {
  let s = String(value ?? '').trim();
  if (/^#[0-9a-f]{3}$/i.test(s)) {
    const r = s[1], g = s[2], b = s[3];
    return ('#' + r + r + g + g + b + b).toLowerCase();
  }
  if (/^#[0-9a-f]{6}$/i.test(s)) return s.toLowerCase();
  return String(fallback).toLowerCase();
}

function hexToRgb(hex) {
  const clean = normalizeHex(hex, '#000000').replace('#', '');
  return {
    r: parseInt(clean.slice(0, 2), 16),
    g: parseInt(clean.slice(2, 4), 16),
    b: parseInt(clean.slice(4, 6), 16)
  };
}

function rgbToHex(r, g, b) {
  const to = n => Math.max(0, Math.min(255, Math.round(n))).toString(16).padStart(2, '0');
  return '#' + to(r) + to(g) + to(b);
}

function mixHex(a, b, weight) {
  const w = Math.max(0, Math.min(1, Number(weight) || 0));
  const ca = hexToRgb(a);
  const cb = hexToRgb(b);
  return rgbToHex(
    ca.r + (cb.r - ca.r) * w,
    ca.g + (cb.g - ca.g) * w,
    ca.b + (cb.b - ca.b) * w
  );
}

function luminance(hex) {
  const { r, g, b } = hexToRgb(hex);
  const a = [r, g, b].map(v => {
    const c = v / 255;
    return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  });
  return 0.2126 * a[0] + 0.7152 * a[1] + 0.0722 * a[2];
}

function contrastRatio(hex1, hex2) {
  const l1 = luminance(hex1);
  const l2 = luminance(hex2);
  const lighter = Math.max(l1, l2);
  const darker = Math.min(l1, l2);
  return (lighter + 0.05) / (darker + 0.05);
}

function readableOn(bg) {
  return contrastRatio('#ffffff', bg) >= contrastRatio('#111111', bg) ? '#ffffff' : '#111111';
}

function ensureContrast(fg, bg, min) {
  let out = normalizeHex(fg, bg);
  const background = normalizeHex(bg, '#000000');
  if (contrastRatio(out, background) >= min) return out;

  const target = readableOn(background);
  for (let i = 1; i <= 24; i++) {
    out = mixHex(out, target, i / 24);
    if (contrastRatio(out, background) >= min) return out;
  }
  return target;
}

function hexToRgba(hex, alpha) {
  const { r, g, b } = hexToRgb(hex);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function sanitizeCustomTheme(value) {
  const src = isObj(value) ? value : {};
  return {
    bg: normalizeHex(src.bg, DEFAULT_CUSTOM_THEME.bg),
    panel: normalizeHex(src.panel, DEFAULT_CUSTOM_THEME.panel),
    border: normalizeHex(src.border, DEFAULT_CUSTOM_THEME.border),
    text: normalizeHex(src.text, DEFAULT_CUSTOM_THEME.text),
    muted: normalizeHex(src.muted, DEFAULT_CUSTOM_THEME.muted),
    accent: normalizeHex(src.accent, DEFAULT_CUSTOM_THEME.accent)
  };
}

  const muted = ensureContrast(c.muted, bg, 3.1);
  const border = ensureContrast(c.border, bg, 1.25);
  const accent = c.accent;

  let panel = c.panel;
  if (contrastRatio(panel, bg) < 1.06) {
    panel = mixHex(panel, text, isLight ? 0.08 : 0.12);
  }

    ? mixHex(panel, '#000000', 0.035)
    : mixHex(panel, text, 0.08);

  const panel3 = isLight
    ? mixHex(panel, '#ffffff', 0.35)
    : mixHex(panel, text, 0.025);

  const inputBg = isLight ? '#ffffff' : mixHex(bg, '#000000', 0.22);
  const hover = isLight ? mixHex(panel, '#000000', 0.055) : mixHex(panel, text, 0.075);
  const active = isLight ? mixHex(panel, '#000000', 0.10) : mixHex(panel, text, 0.13);

  const overlay = hexToRgba(bg, isLight ? 0.58 : 0.84);
  const scroll = mixHex(border, text, 0.18);
  const borderStrong = mixHex(border, text, 0.18);

  const accentContrast = readableOn(accent);
  const accentSoft = hexToRgba(accent, isLight ? 0.14 : 0.18);
  const accentGlow = hexToRgba(accent, isLight ? 0.26 : 0.35);

  const semantic = isLight
    ? { cyan: '#0b8f9c', green: '#16845b', orange: '#b45309', red: '#c2384f' }
    : { cyan: '#83e5ed', green: '#8fe0bd', orange: '#f4c58b', red: '#f49aaa' };

  const taskA = mixHex(panel, text, isLight ? 0.025 : 0.055);
  const taskB = mixHex(panel, text, isLight ? 0.065 : 0.105);

  const vars = Object.assign({}, isLight ? LIGHT_VARS : DARK_VARS);

  Object.assign(vars, {
    '--bg': bg,
    '--panel': panel,
    '--panel2': panel2,
    '--panel3': panel3,
    '--border': border,
    '--border-strong': borderStrong,
    '--text': text,
    '--muted': muted,
    '--accent': accent,

    '--cyan': semantic.cyan,
    '--green': semantic.green,
    '--orange': semantic.orange,
    '--red': semantic.red,

    '--input-bg': inputBg,
    '--hover': hover,
    '--active': active,
    '--shadow': shadow,
    '--overlay': overlay,
    '--scroll': scroll,

    '--accent-contrast': accentContrast,
    '--accent-soft': accentSoft,
    '--accent-glow': accentGlow,
    '--gradient-brand': `linear-gradient(135deg, ${accent}, ${semantic.cyan})`,
    '--gradient-accent': `linear-gradient(120deg, ${accent}, ${semantic.cyan})`,

    '--surface-lane': hexToRgba(panel, isLight ? 0.88 : 0.92),
    '--surface-task': `linear-gradient(145deg, ${taskA}, ${taskB})`,
    '--surface-task-hover': mixHex(accent, text, 0.25),
    '--surface-modal': panel,
    '--surface-menu': panel3,
    '--surface-toolbar': isLight ? mixHex(bg, '#ffffff', 0.45) : mixHex(panel3, '#000000', 0.12),
    '--surface-field': inputBg,

    '--danger-fg': isLight ? '#b42340' : '#ffb3bf',
    '--danger-bd': isLight ? '#f0a7b7' : '#6b3441',
    '--warning-fg': isLight ? '#8a5a00' : '#f3e0a8',
    '--warning-bd': isLight ? '#e2c078' : '#6a5a2e',
    '--warning-bg': isLight ? '#fff5d6' : hexToRgba('#2c2615', 0.8),

    '--color-scheme': isLight ? 'light' : 'dark'
  });

  return vars;
}

function saveThemeState(vars) {
  try {
    localStorage.setItem(THEME_MODE_KEY, themeMode);
    localStorage.setItem(THEME_CUSTOM_KEY, JSON.stringify(customTheme));
    localStorage.setItem(THEME_VARS_KEY, JSON.stringify(vars || {}));
  } catch (e) {
    /* localStorage может быть недоступен — тема просто не сохранится */
  }
}

function loadThemeState() {
  try {
    const mode = localStorage.getItem(THEME_MODE_KEY);
    if (['dark', 'light', 'system', 'custom'].includes(mode)) {
      themeMode = mode;
    }
  } catch (e) {
    themeMode = 'dark';
  }

  try {
    const saved = JSON.parse(localStorage.getItem(THEME_CUSTOM_KEY) || 'null');
    if (saved) customTheme = sanitizeCustomTheme(saved);
  } catch (e) {
    customTheme = { ...DEFAULT_CUSTOM_THEME };
  }
}

function applyTheme(mode = themeMode, custom = customTheme, persist = true) {
  if (!['dark', 'light', 'system', 'custom'].includes(mode)) mode = 'dark';
  themeMode = mode;
  customTheme = sanitizeCustomTheme(custom);

  const resolved = themeMode === 'system'
    ? (themeMedia.matches ? 'light' : 'dark')
    : themeMode;

  const vars = themeMode === 'custom'
    ? deriveCustomTheme(customTheme)
    : Object.assign({}, resolved === 'light' ? LIGHT_VARS : DARK_VARS);

  lastAppliedThemeVars = vars;

  const root = document.documentElement;
  root.dataset.theme = themeMode;
  root.dataset.resolvedTheme = resolved;
  root.style.colorScheme = vars['--color-scheme'] || 'dark';

  Object.keys(vars).forEach(key => {
    root.style.setProperty(key, vars[key]);
  });

  if (persist) saveThemeState(vars);
  syncThemeModal();
}

function setThemeMode(mode) {
  applyTheme(mode, customTheme, true);
}

function autoFixCustomTheme() {
  const vars = deriveCustomTheme(customTheme);
  customTheme = {
    bg: vars['--bg'],
    panel: vars['--panel'],
    border: vars['--border'],
    text: vars['--text'],
    muted: vars['--muted'],
    accent: ensureContrast(vars['--accent'], vars['--bg'], 3)
  };
  applyTheme('custom', customTheme, true);
}

function resetCustomTheme() {
  customTheme = { ...DEFAULT_CUSTOM_THEME };
  applyTheme('custom', customTheme, true);
}

function updateThemeWarning() {
  if (!themeModalBody || !themeModalBody.isConnected || !lastAppliedThemeVars) return;

  const el = themeModalBody.querySelector('#themeWarning');
  if (!el) return;

  const v = lastAppliedThemeVars;
  const warnings = [];

  if (contrastRatio(v['--text'], v['--bg']) < 4.5) {
    warnings.push('Основной текст может плохо читаться на фоне.');
  }
  if (contrastRatio(v['--muted'], v['--bg']) < 3) {
    warnings.push('Вторичный текст слишком блёклый.');
  }
  if (contrastRatio(v['--border'], v['--bg']) < 1.18) {
    warnings.push('Границы элементов почти не видны.');
  }
  if (contrastRatio(v['--accent'], v['--bg']) < 2.2) {
    warnings.push('Акцентный цвет может теряться на фоне.');
  }

  el.hidden = warnings.length === 0;
  el.textContent = warnings.join(' ');
}

function syncThemeModal() {
  if (!themeModalBody || !themeModalBody.isConnected) return;

  themeModalBody.querySelectorAll('[data-theme-mode]').forEach(button => {
    const active = button.dataset.themeMode === themeMode;
    button.classList.toggle('active', active);
    button.setAttribute('aria-checked', active ? 'true' : 'false');
  });

  const customPanel = themeModalBody.querySelector('#themeCustomPanel');
  if (customPanel) customPanel.hidden = themeMode !== 'custom';

  themeModalBody.querySelectorAll('[data-theme-color]').forEach(input => {
    const key = input.dataset.themeColor;
    input.value = customTheme[key] || DEFAULT_CUSTOM_THEME[key] || '#000000';
  });

  updateThemeWarning();
}

function themeColorFieldHtml(label, key) {
  return `
    <label class="theme-color">
      <span>${esc(label)}</span>
      <input type="color" data-theme-color="${esc(key)}" value="${esc(customTheme[key])}">
    </label>
  `;
}

function themeModalHtml() {
  return `
    <div class="theme-settings">
      <div class="theme-mode-grid" role="radiogroup" aria-label="Режим темы">
        <button type="button" class="theme-mode-btn" data-theme-mode="dark" role="radio" aria-checked="${themeMode === 'dark'}">Тёмная</button>
        <button type="button" class="theme-mode-btn" data-theme-mode="light" role="radio" aria-checked="${themeMode === 'light'}">Светлая</button>
        <button type="button" class="theme-mode-btn" data-theme-mode="system" role="radio" aria-checked="${themeMode === 'system'}">Системная</button>
        <button type="button" class="theme-mode-btn" data-theme-mode="custom" role="radio" aria-checked="${themeMode === 'custom'}">Пользовательская</button>
      </div>

      <div class="theme-custom-panel" id="themeCustomPanel"${themeMode === 'custom' ? '' : ' hidden'}>
        <div class="theme-color-grid">
          ${themeColorFieldHtml('Фон', 'bg')}
          ${themeColorFieldHtml('Панели', 'panel')}
          ${themeColorFieldHtml('Границы', 'border')}
          ${themeColorFieldHtml('Текст', 'text')}
          ${themeColorFieldHtml('Вторичный текст', 'muted')}
          ${themeColorFieldHtml('Акцент', 'accent')}
        </div>

        <div class="theme-actions-row">
          <button type="button" class="btn small" data-theme-action="auto-contrast">Подобрать контраст</button>
          <button type="button" class="btn small" data-theme-action="reset">Сбросить тему</button>
        </div>

        <div id="themeWarning" class="theme-warning" hidden></div>
      </div>

      <div class="theme-preview" aria-hidden="true">
        <div class="theme-preview-card">
          <div class="theme-preview-title">Пример карточки</div>
          <div class="theme-preview-tags">
            <span class="tag status">Статус</span>
            <span class="tag flow">Флоу</span>
            <span class="tag category">Категория</span>
          </div>
          <div class="theme-preview-text">
            Так будут выглядеть свойства, описание и служебные элементы в выбранной теме.
          </div>
          <button type="button" class="btn primary small" tabindex="-1">Основное действие</button>
        </div>
      </div>
    </div>
  `;
}

function openThemeSettings() {
  closeMenu();

  const m = showModal({
    title: 'Тема интерфейса',
    width: 620,
    body: themeModalHtml(),
    actions: [
      { label: 'Закрыть', value: null }
    ]
  });

  themeModalBody = m.body;

  const cleanup = () => {
    themeModalBody = null;
  };
  m.promise.then(cleanup, cleanup);

  m.body.addEventListener('click', event => {
    const modeButton = event.target.closest('[data-theme-mode]');
    if (modeButton) {
      setThemeMode(modeButton.dataset.themeMode);
      return;
    }

    const action = event.target.closest('[data-theme-action]');
    if (!action) return;

    if (action.dataset.themeAction === 'auto-contrast') {
      autoFixCustomTheme();
    } else if (action.dataset.themeAction === 'reset') {
      resetCustomTheme();
    }
  });

  m.body.addEventListener('input', event => {
    const colorInput = event.target.closest('[data-theme-color]');
    if (!colorInput) return;

    const key = colorInput.dataset.themeColor;
    customTheme[key] = colorInput.value;

    if (themeMode !== 'custom') {
      themeMode = 'custom';
    }

    applyTheme('custom', customTheme, true);
  });

  syncThemeModal();
}

function initTheme() {
  if (themeInitialized) return;
  themeInitialized = true;

  loadThemeState();
  applyTheme(themeMode, customTheme, true);

  const onSystemThemeChange = () => {
    if (themeMode === 'system') {
      applyTheme('system', customTheme, false);
    }
  };

  if (typeof themeMedia.addEventListener === 'function') {
    themeMedia.addEventListener('change', onSystemThemeChange);
  } else if (typeof themeMedia.addListener === 'function') {
    themeMedia.addListener(onSystemThemeChange);
  }
}

/* ---------- События ---------- */
$('newTaskBtn').addEventListener('click', () => {
if (activeSection.type === 'board') openEditor();
else openKnowledgeEditor(null);
});
$('refreshBtn').addEventListener('click', () => {
if (workspaceState !== 'ready') { initWorkspace(); return; }
refreshWorkspace();
if (activeSection.type === 'knowledge') loadKnowledge(activeSection.id);
else loadBoard(true);
});
// Повтор после ошибки загрузки доски.
$('board').addEventListener('click', event => {
const laneToggle = event.target.closest('[data-toggle-lane]');
if (laneToggle) { toggleLane(laneToggle.dataset.toggleLane); return; }
if (event.target.closest('[data-add-column]')) { addStatusColumn(); return; }
if (!event.target.closest('[data-board-retry]')) return;
if (activeSection.type === 'board' && activeSection.id !== null) {
boardNeedsLoad = true;
$('board').innerHTML = '<div class="loading">Загружаем задачи…</div>';
loadBoard(true, true);
}
});
$('closeEditor').addEventListener('click', requestCloseEditor);
$('compactBtn').addEventListener('click', () => setCompact(!isCompact()));
$('toggleFullscreen').addEventListener('click', () => setFullscreen(!fullscreen));
$('propsToggle').addEventListener('click', () => setPropsCollapsed(!propsCollapsed));
$('taskOverlay').addEventListener('click', event => {
if (event.target === $('taskOverlay')) requestCloseEditor();
});
// Поиск и быстрые фильтры правят черновик представления.
$('search').addEventListener('input', () => {
draft.filters.search = $('search').value;
refreshView();
});
FILTERS.forEach(([id, field]) => {
$(id).addEventListener('change', () => {
const value = $(id).value;
if (value && value !== '__multi') draft.filters.values[field] = [value];
else delete draft.filters.values[field];
syncQuickSelects();
refreshView();
});
});
// Представления: вкладки, меню «⋯», создание.
$('viewTabs').addEventListener('click', event => {
const tab = event.target.closest('[data-view]');
if (tab) { selectView(tab.dataset.view); return; }
const more = event.target.closest('[data-view-menu]');
if (more) { openViewMenu(more); return; }
if (event.target.closest('[data-add-view]')) addView();
});
$('filtersBtn').addEventListener('click', openFiltersPanel);
$('columnsBtn').addEventListener('click', () => openViewSettings('active'));
$('propsBtn').addEventListener('click', openPropertySettings);
$('exportBtn').addEventListener('click', openExport);
// Тема теперь открывается из раздела «Настройки» боковой панели: то же окно и тот же механизм сохранения.
$('themeBtn').addEventListener('click', () => {
document.body.classList.remove('sidebar-open');
syncSidebarToggle();
openThemeSettings();
});

// Этап 5: sidebar и базы знаний.
// Скрытие панели меняет только классы: доска, фильтры, представление и открытые редакторы не перезагружаются.
// Широкий экран: панель сворачивается совсем, состояние хранится в localStorage.
// Узкий экран: панель выезжает поверх и закрывается кнопкой ✕.
$('sidebarToggle').addEventListener('click', () => {
if (isDesktopLayout()) setSidebarCollapsed(false, true);
else {
document.body.classList.toggle('sidebar-open');
syncSidebarToggle();
}
});
$('sidebarCollapse').addEventListener('click', () => setSidebarCollapsed(true, true));
$('sidebarClose').addEventListener('click', () => {
document.body.classList.remove('sidebar-open');
syncSidebarToggle();
});
if (desktopMedia.addEventListener) {
desktopMedia.addEventListener('change', () => {
// При смене размера окна выезжающая панель не должна оставаться открытой.
document.body.classList.remove('sidebar-open');
syncSidebarToggle();
});
}
syncSidebarToggle();
$('addBoardBtn').addEventListener('click', addBoard);
$('addKnowledgeBtn').addEventListener('click', addKnowledge);
$('showArchived').checked = showArchived;
$('showArchived').addEventListener('change', event => {
showArchived = event.target.checked;
try { localStorage.setItem(SHOW_ARCHIVED_KEY, showArchived ? '1' : '0'); } catch (e) { /* не критично */ }
renderSidebar();
});
$('sidebar').addEventListener('click', event => {
if (event.target.closest('[data-side-retry]')) {
initWorkspace();
return;
}
const menuTrigger = event.target.closest('[data-side-menu]');
if (menuTrigger) {
openSideMenu(menuTrigger, menuTrigger.dataset.sideMenu, Number(menuTrigger.dataset.sideId));
return;
}

const row = event.target.closest('[data-side-id]');
if (!row) return;
if (event.target.closest('.side-menu')) return;
switchSection(row.dataset.sideType, Number(row.dataset.sideId));
});

$('newKnowledgeBtn').addEventListener('click', () => openKnowledgeEditor(null));
$('knowledgeSearch').addEventListener('input', event => {
knowledgeSearch = event.target.value;
renderKnowledge();
});
$('knowledgeBoard').addEventListener('click', event => {
if (event.target.closest('[data-kn-retry]')) {
if (activeSection.type === 'knowledge') {
$('knowledgeBoard').innerHTML = '<div class="loading">Загружаем статьи…</div>';
loadKnowledge(activeSection.id);
}
return;
}
const card = event.target.closest('[data-kn-id]');
if (!card) return;
const article = knowledgeArticles.find(a => a._id === card.dataset.knId);
if (article) openKnowledgeEditor(article);
});

$('sortKey').addEventListener('change', () => {
draft.sort.key = $('sortKey').value;
if (!draft.sort.key) draft.sort.dir = 'asc';
renderSortControls();
refreshView();
});
$('sortDir').addEventListener('click', () => {
if (!draft.sort.key) return;
draft.sort.dir = draft.sort.dir === 'desc' ? 'asc' : 'desc';
renderSortControls();
refreshView();
});
// Панель «фильтры изменены»: сохранить, сохранить как новое, сбросить.
$('draftSave').addEventListener('click', saveDraftToView);
$('draftSaveAs').addEventListener('click', saveAsNew);
$('draftReset').addEventListener('click', () => {
initDraft();
renderAll();
});
$('taskTitle').addEventListener('input', () => {
editor.values['задача'] = $('taskTitle').value.trim();
scheduleSave(false);
});
// Для новой карточки уход из поля названия сразу создаёт запись.
$('taskTitle').addEventListener('blur', () => {
if (editor.open && editor.mode === 'create' && editor.values['задача']) scheduleSave(true);
});
// Enter в названии сохраняет и переводит курсор в описание.
$('taskTitle').addEventListener('keydown', event => {
if (event.key !== 'Enter') return;
event.preventDefault();
scheduleSave(true);
if (!$('commentSection').hidden) rich.focus();
});
$('taskForm').addEventListener('submit', event => {
event.preventDefault();
scheduleSave(true);
});
// Диалоги закрываются по клику на подложку (только если нажатие тоже началось на ней).
let downOnBackdrop = false;
$('modalOverlay').addEventListener('mousedown', event => {
downOnBackdrop = event.target === $('modalOverlay');
});
$('modalOverlay').addEventListener('click', event => {
if (downOnBackdrop && event.target === $('modalOverlay') && modal) {
if (knEditor.open) requestCloseKnowledgeEditor();
else modal.close(undefined);
}
downOnBackdrop = false;
});
document.addEventListener('click', event => {
if (openMenu && !openMenu.menu.contains(event.target) && !openMenu.trigger.contains(event.target)) {
closeMenu();
}
});
document.addEventListener('keydown', event => {
if (event.key !== 'Escape') return;
if (modal) {
if (knEditor.open) requestCloseKnowledgeEditor();
else modal.close(undefined);
}
else if (openMenu) closeMenu();
else if (editor.open) requestCloseEditor();
});
window.addEventListener('resize', closeMenu);
window.addEventListener('scroll', event => {
// Прокрутка внутри самого меню не должна его закрывать.
if (openMenu && !openMenu.menu.contains(event.target)) closeMenu();
}, true);
window.addEventListener('beforeunload', event => {
if (pending > 0 || editor.inFlight || isDirty() || knEditor.inFlight || (knEditor.open && knDirty())) {
event.preventDefault();
event.returnValue = '';
}
});

try { fullscreen = localStorage.getItem(FS_KEY) === '1'; } catch (e) { fullscreen = false; }
try { propsCollapsed = localStorage.getItem(PROPS_KEY) === '1'; } catch (e) { propsCollapsed = false; }
try { showArchived = localStorage.getItem(SHOW_ARCHIVED_KEY) === '1'; } catch (e) { showArchived = false; }

initTheme();
bindTaskLinkUi();
initWorkspace();

setInterval(() => {
  if (document.hidden) return;
  if (loading || pending > 0 || editorBusy() || (knEditor.open && (knEditor.inFlight || knDirty()))) return;
  refreshWorkspace();
  if (activeSection.type === 'board') loadBoard();
}, 30000);
// При возвращении на вкладку сразу подтягиваем свежий список.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) refreshWorkspace();
});
})();
</script>
