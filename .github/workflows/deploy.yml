name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      # Зеркало для сетей, где провайдер блокирует supabase.co.
      # Пока переменная репозитория SUPABASE_PROXY_URL не задана, шаг пропускается
      # и основная сборка остаётся ровно такой же, как раньше.
      - name: Build mirror (optional)
        if: vars.SUPABASE_PROXY_URL != ''
        run: npm run build:mirror
        env:
          SUPABASE_PROXY_URL: ${{ vars.SUPABASE_PROXY_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
